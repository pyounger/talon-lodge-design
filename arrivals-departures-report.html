<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrivals &amp; Departures — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#eef3f1; --surface:#ffffff; --surface-2:#e6efeb; --raise:#f5f9f7;
  --ink:#12292a; --muted:#4f645f; --faint:#7a8b86;
  --line:#d6e2dd; --line-2:#c1d1cb;
  --accent:#0e7c6f; --accent-deep:#0a544c; --accent-soft:#dcece6;
  --salmon:#bd5836; --salmon-deep:#9a4529; --salmon-soft:#f2e2db;
  --gold:#a9791f; --gold-soft:#f3e8d0;
  --shadow:0 1px 2px rgba(18,42,43,.05),0 10px 26px rgba(18,42,43,.07);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --paper:#081210; --surface:#0e1c1a; --surface-2:#152522; --raise:#122320;
  --ink:#e9f1ed; --muted:#9bada9; --faint:#6f817c;
  --line:#20332d; --line-2:#2e453e;
  --accent:#38b8a6; --accent-deep:#5fd0bf; --accent-soft:#0f2a26;
  --salmon:#e18a62; --salmon-deep:#eda588; --salmon-soft:#31231b;
  --gold:#d9ad55; --gold-soft:#2a2413;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#081210; --surface:#0e1c1a; --surface-2:#152522; --raise:#122320;
  --ink:#e9f1ed; --muted:#9bada9; --faint:#6f817c;
  --line:#20332d; --line-2:#2e453e;
  --accent:#38b8a6; --accent-deep:#5fd0bf; --accent-soft:#0f2a26;
  --salmon:#e18a62; --salmon-deep:#eda588; --salmon-soft:#31231b;
  --gold:#d9ad55; --gold-soft:#2a2413;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:clamp(14px,3vw,26px) clamp(12px,3vw,22px) 60px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit}

.masthead{border:1px solid var(--line-2);border-top:4px solid var(--accent);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:18px clamp(15px,3vw,22px);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-deep)}
.titlerow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:9px}
.masthead h1{font-family:var(--serif);font-weight:900;font-size:clamp(25px,4.4vw,38px);line-height:1.02;letter-spacing:-.015em}
.masthead .date{font-size:15px;color:var(--muted);margin-top:7px}
.masthead .date b{color:var(--ink);font-weight:600}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{font-weight:700;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:11px;padding:10px 14px;min-width:0}
.stat .v{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.stat.arr{border-left:3px solid var(--accent)} .stat.dep{border-left:3px solid var(--salmon)} .stat.rep{border-left:3px solid var(--gold)}
.rephint{margin-top:12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rep{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;font-weight:600;background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);border-radius:20px;padding:2px 7px;white-space:nowrap}

/* dividers */
.dir{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin:26px 2px 12px}
.dir::before{content:"";width:22px;height:2px;border-radius:2px}
.dir.arr{color:var(--accent-deep)} .dir.arr::before{background:var(--accent)}
.dir.dep{color:var(--salmon-deep)} .dir.dep::before{background:var(--salmon)}
.dir h2{font-family:var(--serif);font-weight:600;font-size:clamp(20px,3.4vw,27px);letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.dir .c{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.04em}

.sec{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;break-inside:avoid}
.sec-hd{display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec.arr .sec-hd{background:linear-gradient(0deg,var(--surface),var(--accent-soft))}
.sec.dep .sec-hd{background:linear-gradient(0deg,var(--surface),var(--salmon-soft))}
.sec-time{font-family:var(--mono);font-weight:600;font-size:18px;white-space:nowrap}
.sec.arr .sec-time{color:var(--accent-deep)} .sec.dep .sec-time{color:var(--salmon-deep)}
.sec-what{min-width:0;flex:1}
.sec-carrier{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:-.01em}
.sec-loc{font-size:12.5px;color:var(--muted);margin-top:1px}
.sec-meta{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:20px;padding:4px 10px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.rc{background:var(--gold-soft);color:var(--gold)}
.flag{display:flex;gap:8px;align-items:center;padding:9px 15px;background:var(--gold-soft);color:var(--gold);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line)}

.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 15px;border-top:1px solid var(--line)}
.g:first-child{border-top:0}
.g-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.g-name{font-weight:700;font-size:15px;letter-spacing:-.01em}
.g-grp{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em}
.g-note{font-size:12px;color:var(--salmon-deep);margin-top:2px}
.g-tel{font-family:var(--mono);font-size:12.5px;color:var(--accent-deep);text-decoration:none;white-space:nowrap}
.g-tel:hover{text-decoration:underline}

/* movement by group */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:4px}
table.grp{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px}
table.grp th,table.grp td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line)}
table.grp thead th{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);background:var(--surface-2)}
table.grp td.n,table.grp th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
table.grp tbody tr:last-child td{border-bottom:0}
table.grp .gname{font-weight:600}
table.grp .a{color:var(--accent-deep)} table.grp .d{color:var(--salmon-deep)}
table.grp tfoot td{font-weight:700;border-top:2px solid var(--line-2);background:var(--raise)}

.foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:560px){
  .g{grid-template-columns:1fr}
  .g-tel{justify-self:start}
  .titlerow{flex-direction:column;align-items:stretch}.tools{margin-left:0}.tools .btn{flex:1;justify-content:center}
  .sec-meta{margin-left:0;width:100%}
}
@media print{
  @page{size:letter;margin:12mm}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  html,body{background:#fff}
  .no-print{display:none !important}
  .wrap{max-width:none;padding:0}
  .sec,.g,table.grp{break-inside:avoid}
  .dir.dep{break-before:page}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand"><span>🎣</span><span>Talon Lodge · Manager Overview</span></div>
    <div class="titlerow">
      <h1>Arrivals &amp; Departures</h1>
      <div class="tools no-print">
        <button class="btn" onclick="M.theme()">◐ Theme</button>
        <button class="btn" onclick="window.print()">⎙ Print</button>
      </div>
    </div>
    <div class="date" id="date"></div>
    <div class="stats" id="stats"></div>
    <div class="rephint"><span class="rep">🔁 N</span> returning guest — the number is their prior stays.</div>
  </header>

  <div class="dir arr"><h2>Who’s coming</h2><span class="c" id="arrc"></span></div>
  <div id="secs_arr"></div>

  <div class="dir dep"><h2>Who’s leaving</h2><span class="c" id="depc"></span></div>
  <div id="secs_dep"></div>

  <div class="dir arr" style="color:var(--muted)"><h2>Movement by group</h2></div>
  <div class="tablewrap"><table class="grp" id="grptbl"></table></div>

  <div class="foot"><span>Talon Lodge &amp; Spa · Sitka, Alaska</span><span id="footdate"></span></div>
</div>

<script>
(function(){
  var DATE_LONG='Thursday, August 13, 2026';
  var SCHED={
    arr:[
      {time:'10:05 AM',carrier:'Alaska Airlines',flight:'62',loc:'Sitka Airport (SIT)',pax:[
        {n:'Timothy Ruff',grp:'Ruff',ph:'4109843941',rep:6},
        {n:'Jessica Ruff',grp:'Ruff',ph:'4105964052',rep:6},
        {n:'Charlotte Ruff',grp:'Ruff',ph:'4105964052'},
        {n:'Timmy Ruff',grp:'Ruff',ph:'4105964052'},
        {n:'Dustin Haugland',grp:'Ruff',ph:'7084153244'},
        {n:'Jennifer Haugland',grp:'Ruff',ph:'4109241806'}
      ]},
      {time:'~ Noon',carrier:'Private Jet · Cirrus N969DW',flight:'',loc:'Sitka Airport (SIT)',pax:[
        {n:'Jourdi de Werd',grp:'de Werd',ph:'2133218373',rep:3},
        {n:'Michelle de Werd',grp:'de Werd',ph:'8053500300'}
      ]},
      {time:'1:00 PM',carrier:'Alaska Airlines',flight:'63/303/633',loc:'Sitka Airport (SIT)',pax:[
        {n:'Jorge Gonzalez',grp:'Barrett',ph:'7048464584'},
        {n:'Michael Purmort',grp:'Barrett',ph:'9542548182'},
        {n:'Jim Ziething',grp:'Barrett',ph:'9496780586'},
        {n:'Bret Barrett',grp:'Barrett',ph:'9494448568',rep:4},
        {n:'Courtney Ziething',grp:'Barrett',ph:'9495334507'},
        {n:'Marshall Ininns',grp:'Barrett',ph:'9498742066',note:'"I’ll be the guy in fishing clothes."'},
        {n:'Brad Barrett',grp:'Barrett',ph:'9492441486'},
        {n:'Susan Welch',grp:'Feliciano',ph:'5593875626'}
      ]},
      {time:'Pickup',carrier:'Hotel / B&B',flight:'',loc:'Southeast Alaska Resort',pax:[
        {n:'Renee Savage',grp:'Feliciano',ph:'5593032003'},
        {n:'Mark Savage',grp:'Feliciano',ph:'5592803196'},
        {n:'Allen Daugherty',grp:'Daugherty',ph:'3256606949'},
        {n:'Everett Welch',grp:'Feliciano',ph:'5597869028'},
        {n:'Sharon Daugherty',grp:'Daugherty',ph:'3256656154'}
      ]},
      {time:'Call first',carrier:'Hotel / B&B',flight:'',loc:'Lodging not known — call before arrival',pax:[
        {n:'John Feliciano',grp:'Feliciano',ph:'8056802593'},
        {n:'Louise Feliciano',grp:'Feliciano',ph:'8056802593'}
      ]}
    ],
    dep:[
      {time:'7:00 AM',carrier:'Alaska Airlines',flight:'90',loc:'Sitka Airport (SIT)',flag:'No boat transportation from Talon on departure day',pax:[
        {n:'Kirk Venge',grp:'Venge',ph:'7073378320',rep:5},
        {n:'Brittany Pederson',grp:'Venge',ph:'7072915293'}
      ]},
      {time:'10:45 AM',carrier:'Alaska Airlines',flight:'62',loc:'Sitka Airport (SIT)',pax:[
        {n:'John McAuliffe',grp:'McAuliffe',ph:'2067699634'},
        {n:'Ernest Price',grp:'Price',ph:'8584878048'},
        {n:'Liz McAuliffe',grp:'McAuliffe',ph:'2066697033'},
        {n:'LeAnn Smith',grp:'Wilson',ph:'8179197735'},
        {n:'Joe Smith',grp:'Wilson',ph:'8179392441'},
        {n:'Phil Graham',grp:'Price',ph:'5625984020'},
        {n:'Gary Koski',grp:'Koski',ph:'5635705209'}
      ]},
      {time:'1:45 PM',carrier:'Alaska Airlines',flight:'58/652/303',loc:'Sitka Airport (SIT)',pax:[
        {n:'Steve Koski',grp:'Koski',ph:'9289656446',note:'Afternoon flight (~1:40)',rep:4},
        {n:'Shawn Wilson',grp:'Wilson',ph:'6236968424'},
        {n:'Diane Wilson',grp:'Wilson',ph:'6236968424'},
        {n:'Roger McCullough',grp:'Wilson',ph:'6029102320'},
        {n:'Marilyn McCullough',grp:'Wilson',ph:'6027222006'},
        {n:'Tim Koski',grp:'Koski',ph:'5209048582'},
        {n:'Bill Propst',grp:'Propst',ph:'2565293998'},
        {n:'William Propst',grp:'Propst',ph:'2566034745'}
      ]},
      {time:'Private',carrier:'Private Aircraft · McMath party',flight:'',loc:'Sitka Airport (SIT)',pax:[
        {n:'Don Mcmath',grp:'McMath',ph:'9852379481',note:'Citation Bravo 418KW',rep:9},
        {n:'Debbie McMath',grp:'McMath',ph:'9856300736',note:'Citation Bravo N418KW'},
        {n:'Danny Ruffin',grp:'McMath',ph:'9855153343',note:'McMath private aircraft'},
        {n:'Barbara Ruffin',grp:'McMath',ph:'9853357050',note:'McMath private aircraft'},
        {n:'Rick Dunn',grp:'McMath',ph:'9856301644',note:'McMath aircraft'},
        {n:'Kay Haddad Dunn',grp:'McMath',ph:'9857788843',note:'McMath aircraft'}
      ]},
      {time:'Call first',carrier:'Hotel / B&B',flight:'',loc:'Lodging not known — call before arrival',pax:[
        {n:'Andrew Koski',grp:'Koski',ph:'5209048541'}
      ]}
    ]
  };
  var esc=function(x){return (x==null?'':String(x)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');};
  var fmtPh=function(d){return d&&d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):(d||'');};

  function renderDir(dir){
    var showRep=(dir==='arr');
    var out=SCHED[dir].map(function(sec){
      var reps=showRep?sec.pax.filter(function(p){return p.rep;}).length:0;
      var rows=sec.pax.map(function(p){
        var rep=(showRep&&p.rep)?' <span class="rep" title="Returning guest · '+p.rep+' prior stays">🔁 '+p.rep+'</span>':'';
        var note=p.note?'<div class="g-note">'+esc(p.note)+'</div>':'';
        var tel=p.ph?'<a class="g-tel" href="tel:+1'+esc(p.ph)+'">'+esc(fmtPh(p.ph))+'</a>':'';
        return '<div class="g"><div class="g-main"><div class="g-top"><span class="g-name">'+esc(p.n)+'</span>'+rep+'<span class="g-grp">'+esc(p.grp)+' Group</span></div>'+note+'</div>'+tel+'</div>';
      }).join('');
      var carrier=esc(sec.carrier)+(sec.flight?' · '+esc(sec.flight):'');
      var flag=sec.flag?'<div class="flag">⚠ '+esc(sec.flag)+'</div>':'';
      var rc=reps?'<span class="chip rc">🔁 '+reps+' returning</span>':'';
      return '<section class="sec '+dir+'"><div class="sec-hd"><span class="sec-time">'+esc(sec.time)+'</span>'+
        '<div class="sec-what"><div class="sec-carrier">'+carrier+'</div><div class="sec-loc">'+esc(sec.loc)+'</div></div>'+
        '<div class="sec-meta"><span class="chip">'+sec.pax.length+' guest'+(sec.pax.length===1?'':'s')+'</span>'+rc+'</div></div>'+
        flag+rows+'</section>';
    }).join('');
    document.getElementById('secs_'+dir).innerHTML=out;
  }

  var nArr=SCHED.arr.reduce(function(s,x){return s+x.pax.length;},0);
  var nDep=SCHED.dep.reduce(function(s,x){return s+x.pax.length;},0);
  var repCount=0;SCHED.arr.forEach(function(s){s.pax.forEach(function(p){if(p.rep)repCount++;});});
  // movement by group
  var G={};function tallyGrp(d){SCHED[d].forEach(function(s){s.pax.forEach(function(p){G[p.grp]=G[p.grp]||{a:0,d:0};G[p.grp][d==='arr'?'a':'d']++;});});}
  tallyGrp('arr');tallyGrp('dep');
  var groups=Object.keys(G).sort(function(a,b){return (G[b].a+G[b].d)-(G[a].a+G[a].d)||a.localeCompare(b);});

  document.getElementById('date').innerHTML='<b>'+esc(DATE_LONG)+'</b> · transfer day';
  document.getElementById('footdate').textContent=DATE_LONG;
  document.getElementById('arrc').textContent=nArr+' guests · '+SCHED.arr.length+' flights / pickups';
  document.getElementById('depc').textContent=nDep+' guests · '+SCHED.dep.length+' flights / pickups';
  document.getElementById('stats').innerHTML=
    '<div class="stat arr"><div class="v">'+nArr+'</div><div class="k">Arriving</div></div>'+
    '<div class="stat dep"><div class="v">'+nDep+'</div><div class="k">Departing</div></div>'+
    '<div class="stat rep"><div class="v">'+repCount+'</div><div class="k">Returning guests</div></div>'+
    '<div class="stat"><div class="v">'+groups.length+'</div><div class="k">Groups</div></div>';
  renderDir('arr');renderDir('dep');
  document.getElementById('grptbl').innerHTML=
    '<thead><tr><th>Group</th><th class="n">Arriving</th><th class="n">Departing</th><th class="n">Total</th></tr></thead>'+
    '<tbody>'+groups.map(function(g){var a=G[g].a||0,d=G[g].d||0;return '<tr><td class="gname">'+esc(g)+' Group</td><td class="n a">'+(a||'—')+'</td><td class="n d">'+(d||'—')+'</td><td class="n">'+(a+d)+'</td></tr>';}).join('')+'</tbody>'+
    '<tfoot><tr><td>All groups</td><td class="n">'+nArr+'</td><td class="n">'+nDep+'</td><td class="n">'+(nArr+nDep)+'</td></tr></tfoot>';

  window.M={theme:function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':(c==='light'?'':'dark');if(n)document.documentElement.setAttribute('data-theme',n);else document.documentElement.removeAttribute('data-theme');}};
})();
</script>
</body>
</html>
