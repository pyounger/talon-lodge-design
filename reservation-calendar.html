<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservation Calendar — 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#eef3f1; --surface:#ffffff; --surface-2:#e6efeb; --raise:#f5f9f7;
  --ink:#12292a; --muted:#4f645f; --faint:#7a8b86;
  --line:#d6e2dd; --line-2:#c1d1cb;
  --accent:#0e7c6f; --accent-deep:#0a544c; --accent-soft:#dcece6;
  --salmon:#bd5836; --salmon-deep:#9a4529; --salmon-soft:#f6e2da;
  --gold:#a9791f; --gold-soft:#f3e8d0;
  --blue:#3b6ea5; --blue-soft:#e4eefa;
  --winemaker:#8a5b7a; --winemaker-soft:#efe4ec; --chef:#5c7a3f; --chef-soft:#e6efdb;
  --shadow:0 1px 2px rgba(18,42,43,.05),0 10px 26px rgba(18,42,43,.07);
  --serif:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --paper:#081210; --surface:#0e1c1a; --surface-2:#152522; --raise:#122320; --ink:#e9f1ed; --muted:#9bada9; --faint:#6f817c;
  --line:#20332d; --line-2:#2e453e; --accent:#38b8a6; --accent-deep:#5fd0bf; --accent-soft:#0f2a26;
  --salmon:#e18a62; --salmon-deep:#eda588; --salmon-soft:#33211a; --gold:#d9ad55; --gold-soft:#2a2413;
  --blue:#7ea6d6; --blue-soft:#14243a; --winemaker:#c79ab6; --winemaker-soft:#2a1f28; --chef:#9dc06f; --chef-soft:#1c2716;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#081210; --surface:#0e1c1a; --surface-2:#152522; --raise:#122320; --ink:#e9f1ed; --muted:#9bada9; --faint:#6f817c;
  --line:#20332d; --line-2:#2e453e; --accent:#38b8a6; --accent-deep:#5fd0bf; --accent-soft:#0f2a26;
  --salmon:#e18a62; --salmon-deep:#eda588; --salmon-soft:#33211a; --gold:#d9ad55; --gold-soft:#2a2413;
  --blue:#7ea6d6; --blue-soft:#14243a; --winemaker:#c79ab6; --winemaker-soft:#2a1f28; --chef:#9dc06f; --chef-soft:#1c2716;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(14px,3vw,24px) clamp(10px,2.5vw,20px) 60px}
h1,h2{margin:0;text-wrap:balance}

.masthead{border:1px solid var(--line-2);border-top:4px solid var(--accent);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:16px clamp(14px,3vw,22px);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-deep)}
.titlerow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:8px}
.masthead h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,4vw,36px);line-height:1;letter-spacing:-.015em}
.masthead .sub{font-size:14px;color:var(--muted);margin-top:6px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{font-weight:700;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-deep)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:11px;padding:10px 14px;min-width:0}
.stat .v{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.stat.sold{border-left:3px solid var(--accent)} .stat.rem{border-left:3px solid var(--gold)}
.progress{margin-top:12px;height:9px;border-radius:20px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

.legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin:0 2px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend .sw{width:15px;height:15px;border-radius:4px;border:1px solid var(--line-2);display:inline-block;vertical-align:-3px;margin-right:6px}
.legend b{color:var(--ink)}

.calwrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);background:var(--surface)}
table.cal{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px;font-size:12.5px}
table.cal th,table.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
table.cal thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:9px 8px;text-align:left;font-weight:600}
table.cal thead th .cap{color:var(--accent-deep);font-weight:600}
th.wk,td.wk{position:sticky;left:0;z-index:2;background:var(--surface);min-width:132px;padding:8px 10px;border-right:2px solid var(--line-2)}
thead th.wk{z-index:4;background:var(--surface-2)}
td.wk .wl{font-weight:700;font-size:12.5px}
td.wk .wd{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
td.wk .ser{display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.04em;border-radius:20px;padding:1px 6px;margin-top:4px}
.ser.Winemaker{background:var(--winemaker-soft);color:var(--winemaker)} .ser.Chef{background:var(--chef-soft);color:var(--chef)}
tr.wine td.wk{border-left:3px solid var(--winemaker)} tr.chef td.wk{border-left:3px solid var(--chef)}

td.cell{padding:0;min-width:104px}
.cellbtn{display:block;width:100%;height:100%;min-height:52px;text-align:left;border:0;background:none;cursor:pointer;padding:7px 8px;font:inherit;color:inherit;border-left:3px solid transparent}
.cellbtn:hover{outline:2px solid var(--accent);outline-offset:-2px}
.cellbtn .g{font-weight:700;font-size:12px;line-height:1.25;color:var(--ink)}
.cellbtn .p{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.st-available .cellbtn{background:var(--raise);color:var(--faint)}
.st-available .cellbtn .g{color:var(--faint);font-weight:500}
.st-confirmed .cellbtn{background:var(--surface);border-left-color:var(--accent)}
.st-reserved .cellbtn{background:var(--blue-soft);border-left-color:var(--blue)}
.st-held .cellbtn{background:var(--salmon-soft);border-left-color:var(--salmon)}
.st-prospect .cellbtn{background:var(--gold-soft);border-left-color:var(--gold);border-left-style:dashed}
.hold{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-family:var(--mono);font-size:9px;font-weight:600;background:var(--salmon);color:#fff;border-radius:20px;padding:1px 6px}
.hold.warn{background:#b6442c} .hold.exp{background:#7a2a1a}
.avail-num{font-family:var(--mono);font-size:11px;text-align:right;padding:8px;color:var(--muted);white-space:nowrap;background:var(--raise)}
.avail-num b{color:var(--ink);font-variant-numeric:tabular-nums}
td.avail-num.done{color:var(--accent-deep)}

/* editor popover */
.pop-bg{position:fixed;inset:0;background:rgba(9,20,18,.4);z-index:40;display:none}
.pop-bg.show{display:block}
.pop{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,94vw);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:18px;display:none}
.pop.show{display:block}
.pop h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:0 0 3px}
.pop .psub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:14px}
.pf{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.pf label{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.pf input,.pf select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;width:100%}
.pf input:focus,.pf select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.segs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg{font-weight:700;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px;cursor:pointer;display:flex;align-items:center;gap:7px;justify-content:center}
.seg .dot{width:11px;height:11px;border-radius:3px;border:1px solid var(--line-2)}
.seg.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.holdbox{border:1px dashed var(--salmon);background:var(--salmon-soft);border-radius:11px;padding:12px 13px;margin-bottom:12px}
.holdbox h4{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--salmon-deep);margin:0 0 9px}
.holdseg{display:flex;gap:6px;flex-wrap:wrap}
.hseg{font-weight:700;font-size:12px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 11px;cursor:pointer}
.hseg.on{border-color:var(--salmon);background:#fff;color:var(--salmon-deep);box-shadow:0 0 0 2px var(--salmon-soft)}
.pf.holddate{margin-top:10px}
.popbtns{display:flex;gap:8px;margin-top:4px}
.popbtns .btn{flex:1;justify-content:center}
.popbtns .del{flex:0 0 auto;color:var(--salmon);border-color:var(--salmon-soft)}

.foot{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tsvbox{width:100%;height:200px;font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:10px;padding:10px;background:var(--raise);color:var(--ink);margin-top:10px;white-space:pre;overflow:auto}
@media print{@page{size:landscape}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.no-print{display:none!important}html,body{background:#fff}.calwrap{overflow:visible;box-shadow:none}table.cal{min-width:auto;font-size:9px}.cellbtn{min-height:auto}}
</style>
</head>

    document.getElementById('stats').innerHTML=
      '<div class="stat sold"><div class="v">'+tot.sold+'</div><div class="k">Beds sold</div></div>'+
      '<div class="stat rem"><div class="v">'+rem+'</div><div class="k">Remaining</div></div>'+
      '<div class="stat"><div class="v">'+tot.total+'</div><div class="k">Total possible</div></div>'+
      '<div class="stat"><div class="v">'+pct+'%</div><div class="k">Sold</div></div>';
    document.getElementById('progbar').style.width=pct+'%';
    document.getElementById('legend').innerHTML=STATUS.map(function(s){return '<span><span class="sw" style="background:'+(s[0]==='available'?'var(--raise)':(s[0]==='confirmed'?'var(--surface)':s[2].replace(')',s[0]==='reserved'?'-soft)':s[0]==='held'?'-soft)':s[0]==='prospect'?'-soft)':')')))+';border-left:3px solid '+s[2]+'"></span><b>'+s[1].split(' · ')[0]+'</b> '+(s[1].split(' · ')[1]||'')+'</span>';}).join('')+
      '<span style="margin-left:auto"><span class="sw" style="border-left:3px solid var(--winemaker)"></span>Winemaker week · <span class="sw" style="border-left:3px solid var(--chef)"></span>Chef week</span>';
    document.getElementById('footnote').textContent=WEEKS.length+' departures · from your 2027 reservation sheet';
  }

  var EDIT=null;
  window.C={
    edit:function(wi,r){var w=WEEKS[wi],c=cellOf(w,r);EDIT={wi,r};
      var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var h=c.hold||{type:'days',days:2};
      document.getElementById('pop').innerHTML=
        '<h3>'+esc(ROOMS[r].name)+'</h3><div class="psub">'+esc(w.label)+' · 2027</div>'+
        '<div class="pf"><label>Guest / party</label><input id="e_guest" value="'+esc(c.guest||'')+'" placeholder="e.g. Marshall (6)"></div>'+
        '<div class="pf"><label>Status</label><div class="segs">'+STATUS.map(function(s){return '<button class="seg'+(c.status===s[0]?' on':'')+'" onclick="C.setStatus(\''+s[0]+'\')"><span class="dot" style="background:'+(s[0]==='available'?'var(--raise)':s[2])+'"></span>'+s[1].split(' · ')[0]+'</button>';}).join('')+'</div></div>'+
        '<div id="holdwrap">'+(c.status==='held'?holdEditor(h):'')+'</div>'+
        '<div class="popbtns"><button class="btn del" onclick="C.clear()">Clear</button><button class="btn" onclick="C.close()">Cancel</button><button class="btn primary" onclick="C.saveCell()">Save</button></div>';
      document.getElementById('pop').classList.add('show');document.getElementById('popbg').classList.add('show');
      EDIT.status=c.status;EDIT.hold=h;
    },
    setStatus:function(st){EDIT.status=st;
      [].forEach.call(document.querySelectorAll('.segs .seg'),function(b){b.classList.toggle('on',b.textContent.trim()===STATUS.filter(function(s){return s[0]===st;})[0][1].split(' · ')[0]);});
      document.getElementById('holdwrap').innerHTML=st==='held'?holdEditor(EDIT.hold||{type:'days',days:2}):'';},
    setHoldType:function(t,days){EDIT.hold=EDIT.hold||{};EDIT.hold.type=t;if(t==='days')EDIT.hold.days=days;EDIT.hold.placed=EDIT.hold.placed||'2026-08-29';
      document.getElementById('holdwrap').innerHTML=holdEditor(EDIT.hold);},
    saveCell:function(){var w=WEEKS[EDIT.wi];var k=key(w,EDIT.r);var guest=document.getElementById('e_guest').value.trim();
      var party=(guest.match(/\((\d+)/)||[])[1];party=party?+party:null;
      var st=EDIT.status;var o={guest:guest,party:party,status:st};
      if(st==='held'){var h=Object.assign({},EDIT.hold);if(h.type==='date'){var di=document.getElementById('e_holddate');if(di)h.date=di.value;}o.hold=h;}
      if(st==='available'&&!guest){delete OV[k];}else{OV[k]=o;}
      save();C.close();render();},
    clear:function(){var w=WEEKS[EDIT.wi];delete OV[key(w,EDIT.r)];save();C.close();render();},
    close:function(){document.getElementById('pop').classList.remove('show');document.getElementById('popbg').classList.remove('show');EDIT=null;},
    exportTSV:function(){
      var head=['Departure','Series'].concat(ROOMS.map(function(r){return r.name+' ('+r.cap+')';})).concat(['Open']);
      var rows=WEEKS.map(function(w){var wc=weekCounts(w);
        return [w.label,w.series].concat(ROOMS.map(function(_,r){var c=cellOf(w,r);if(c.status==='available')return '';
          var tag=c.status==='confirmed'?'':' ['+c.status.toUpperCase()+(c.status==='held'&&c.hold?': '+holdText(c.hold):'')+']';
          return (c.guest||'')+tag;})).concat([wc.avail]);});
      var tsv=[head].concat(rows).map(function(r){return r.join('\t');}).join('\n');
      document.getElementById('pop').innerHTML='<h3>Copy into Google Sheets</h3><div class="psub">Select all · ⌘/Ctrl-C · paste into a Google Sheet</div><textarea class="tsvbox" id="tsv" readonly>'+esc(tsv)+'</textarea><div class="popbtns"><button class="btn" onclick="C.close()">Close</button><button class="btn primary" onclick="C.copyTSV()">Copy</button></div>';
      document.getElementById('pop').classList.add('show');document.getElementById('popbg').classList.add('show');
      var ta=document.getElementById('tsv');ta.focus();ta.select();},
    copyTSV:function(){var ta=document.getElementById('tsv');ta.select();try{document.execCommand('copy');}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(ta.value);}catch(e){}},
    theme:function(){var c=document.documentElement.getAttribute('data-theme');var n=c==='dark'?'light':(c==='light'?'':'dark');if(n)document.documentElement.setAttribute('data-theme',n);else document.documentElement.removeAttribute('data-theme');}
  };
  function holdText(h){if(!h)return '';if(h.type==='date')return 'until '+h.date;return h.days+'-day';}
  function holdEditor(h){h=h||{type:'days',days:2};
    var seg=function(t,d,lbl){var on=(t==='days'?(h.type==='days'&&+h.days===d):(h.type==='date'));return '<button class="hseg'+(on?' on':'')+'" onclick="C.setHoldType(\''+t+'\','+(d||0)+')">'+lbl+'</button>';};
    return '<div class="holdbox"><h4>⏳ Hold timeline — the guest is deciding</h4>'+
      '<div class="holdseg">'+seg('days',1,'1 day')+seg('days',2,'2 days')+seg('date',0,'Until a date')+'</div>'+
      (h.type==='date'?'<div class="pf holddate"><label>Hold until</label><input type="date" id="e_holddate" value="'+esc(h.date||'2026-09-05')+'"></div>':'')+'</div>';}

  render();
})();
</script>
</body>
</html>
