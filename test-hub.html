<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talon Lodge — Test Hub</title><style>html,body{margin:0;background:#0a1413}</style></head><body>
<style>
  :root{--paper:#f3f6f5;--surface:#fff;--surface-2:#eaf1ee;--ink:#122a2b;--muted:#586d6a;--faint:#7f918d;--line:#d7e1de;--line-2:#c2cfcb;--accent:#0e7c6f;--accent-deep:#0a544c;--accent-soft:#e2efeb;--salmon:#c25e39;--gold:#b9892b;--gold-soft:#f6ecd6;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{--paper:#0a1413;--surface:#0f1e1c;--surface-2:#152522;--ink:#e9f1ed;--muted:#9bada9;--faint:#72847f;--line:#22352f;--line-2:#324a43;--accent:#38b8a6;--accent-deep:#57c9b9;--accent-soft:#12302b;--salmon:#e18a62;--gold:#e0b45e;--gold-soft:#2c2413}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-2);flex:0 0 auto;flex-wrap:wrap}
  .brand{font:800 15px/1 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .brand small{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .rolebox{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;padding:3px 5px 3px 12px}
  .rolebox .rl{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .rolebox select{font:700 12.5px var(--sans);color:var(--accent-deep);background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:5px 9px;cursor:pointer}
  .top .sp{margin-left:auto}
  .btn{font:700 12px var(--sans);border-radius:7px;padding:7px 12px;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  .btn.warn{border-color:var(--salmon);color:var(--salmon)}
  .btn:hover{background:var(--surface-2)}
  .body{display:flex;flex:1 1 auto;min-height:0}
  .side{flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line-2);overflow-y:auto;padding:12px 10px}
  .navgrp{margin-bottom:14px}
  .navh{font:700 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:4px 10px 6px}
  .nav{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);margin-bottom:1px}
  .nav:hover{background:var(--surface-2)}
  .nav.on{background:var(--accent-soft)}
  .nav.on .nl{color:var(--accent-deep)}
  .nl{font:700 13.5px var(--sans)}
  .nd{font:500 11px var(--sans);color:var(--faint)}
  .rolenote{font:600 11px var(--sans);color:var(--muted);padding:8px 10px;border:1px dashed var(--line-2);border-radius:8px;margin-top:4px;line-height:1.5}
  .rolenote b{color:var(--accent-deep)}
  .main{flex:1 1 auto;min-width:0;position:relative;background:var(--paper)}
  iframe{width:100%;height:100%;border:0;display:block;background:var(--paper)}
  .hint{position:absolute;left:0;right:0;bottom:0;font:500 11.5px var(--sans);color:var(--muted);background:var(--surface);border-top:1px solid var(--line);padding:6px 14px;display:flex;gap:10px;align-items:center}
  .hint b{color:var(--ink)}
  @media(max-width:760px){.body{flex-direction:column}.side{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-2)}.navgrp{margin:0;flex:0 0 auto}.navh{display:none}.nav{white-space:nowrap}.nd{display:none}.rolenote{display:none}}
</style>
<div class="top">

  <div class="rolebox"><span class="rl">View as</span><select id="rolesel" onchange="HUB.setRole(this.value)"></select></div>

  <button class="btn" onclick="HUB.reload()">↻ Refresh tool</button>
  <button class="btn warn" onclick="HUB.reset()">Reset all demo data</button>
</div>

  </div>
</div>

<script>
(function(){

  var GROUP_ORDER=["Set-up","Operate","Displays","Guest","Reference"];
  var DEFAULT_ROLES=[{"id":"admin","name":"Administrator","apps":"*","locked":true},{"id":"manager","name":"Manager","apps":"*"},{"id":"frontdesk","name":"Front desk","apps":["photos","rooms","flights","daily","booking","portal","approvals","scheduling"]},{"id":"bar","name":"Lodge Services","apps":["meals","beverages","cocktails","photos","sigdisp"]},{"id":"kitchen","name":"Kitchen","apps":["meals","menu","fishproc","fishtypes","daily"]},{"id":"guide","name":"Captain / Guide","apps":["scheduling","daily","photos","fishproc","display"]},{"id":"massage","name":"Massage","apps":["massagesched","massagemenu","photos"]}];

  function renderNav(){

    }).join('');

    else highlight(current);
  }
  function blank(){document.getElementById('frame').removeAttribute('srcdoc');document.getElementById('cur').textContent='No apps for this role';document.getElementById('curd').textContent='';current=null;}
  function highlight(id){[].forEach.call(document.querySelectorAll('.nav'),function(b){b.classList.toggle('on',b.getAttribute('data-id')===id);});}
  function show(id){
    var allowed=allowedFor(currentRole()); if(allowed.indexOf(id)<0)return;

    document.getElementById('frame').srcdoc=decode(id);
    document.getElementById('cur').textContent=t.label||'';
    document.getElementById('curd').textContent=t.desc?('· '+t.desc):'';
    highlight(id);
  }
  window.HUB={
    show:show,
    setRole:function(id){localStorage.setItem('talon_current_role',id);current=null;renderNav();},
    reload:function(){if(current)show(current);},
    reset:function(){
      if(!confirm('Clear ALL Talon demo data in this browser (team, activities, packages, bookings, roles…)? Every tool resets to its seed.'))return;
      Object.keys(localStorage).filter(function(k){return k.indexOf('talon_')===0;}).forEach(function(k){localStorage.removeItem(k);});
      seed();current=null;renderNav();
    }
  };
  function seed(){
    localStorage.setItem('talon_app_catalog_v1',JSON.stringify(TOOLS));
    if(!localStorage.getItem('talon_roles_v1'))localStorage.setItem('talon_roles_v1',JSON.stringify(DEFAULT_ROLES));
    try{var r=JSON.parse(localStorage.getItem('talon_roles_v1'));if(r&&r.length){var b=r.filter(function(x){return x.id==='bar'&&x.name==='Bartender';})[0];if(b){b.name='Lodge Services';localStorage.setItem('talon_roles_v1',JSON.stringify(r));}}}catch(e){}
  }
  // reflect role edits made inside the Access & Roles tool (fires in the parent)
  window.addEventListener('storage',function(e){if(!e.key||e.key==='talon_roles_v1'||e.key==='talon_current_role')renderNav();});
  seed();renderNav();
})();
</script>
</body></html>
