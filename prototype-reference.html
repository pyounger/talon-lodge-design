<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lodge Ops — Setup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#F5F1E6;
  --surface:#FFFFFF;
  --surface-2:#EFE9D8;
  --ink:#1E2B27;
  --primary:#24413C;
  --primary-light:#31544D;
  --accent:#C1652E;
  --accent-dark:#8F481F;
  --line:#DDD3BE;
  --muted:#7A7263;
  --danger:#A3372B;
  --danger-bg:#F7E4E0;
  --ok-bg:#E4EEE0;
  --ok:#3C6B31;
  --radius:8px;
  --font-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}
input,select,textarea,button{font-family:var(--font-body);font-size:14px;color:var(--ink);}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;
}
textarea{resize:vertical;min-height:70px;}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500;letter-spacing:.01em;}
.field{margin-bottom:14px;}
.row{display:flex;gap:14px;}
.row > .field{flex:1;min-width:0;}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;padding:8px 14px;font-weight:500;}
button:hover{background:var(--surface-2);}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
button.primary:hover{background:var(--accent-dark);}
button.ghost{border:none;background:none;color:var(--muted);padding:4px 8px;}
button.ghost:hover{background:var(--surface-2);color:var(--ink);}
button.danger{color:var(--danger);}
button.small{padding:4px 10px;font-size:12px;}

#app{display:flex;min-height:100vh;}

#sidebar{
  width:220px;flex-shrink:0;background:var(--primary);color:#EFE9D8;padding:24px 0;
  display:flex;flex-direction:column;
}
.brand{padding:0 20px 18px;border-bottom:1px solid rgba(239,233,216,.15);margin-bottom:8px;}
.brand h1{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0 0 2px;color:#fff;}
.brand p{margin:0;font-size:11px;color:#B9C7C0;letter-spacing:.04em;text-transform:uppercase;}
.contour{width:100%;height:22px;opacity:.5;margin:10px 0 -4px;}
nav{padding:8px 10px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#D6DED9;
  font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.sidebar-footer{margin-top:auto;padding:14px 20px 0;border-top:1px solid rgba(239,233,216,.15);}
.lodge-switch{font-size:11px;color:#9FB0A8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.lodge-switch select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;}

#main{flex:1;padding:32px 40px;max-width:1100px;}
.page-head{margin-bottom:24px;}
.page-head h2{font-family:var(--font-display);font-size:26px;font-weight:600;margin:0 0 4px;}
.page-head p{margin:0;color:var(--muted);font-size:13.5px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:20px;}
.card h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 14px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
   padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.mono{font-family:var(--font-mono);font-size:12.5px;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-ok{background:var(--ok-bg);color:var(--ok);}
.badge-draft{background:var(--surface-2);color:var(--muted);}
.badge-archived{background:var(--danger-bg);color:var(--danger);}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.section-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:20px 0 10px;}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}
.pill-check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;}
.pill-check input[type=checkbox]{width:auto;}
.pill-check .rate-input{width:110px;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.tag-list label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:400;color:var(--ink);margin:0;cursor:pointer;}
.tag-list input{width:auto;}
.close-row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.computed{background:var(--surface-2);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
.computed .mono{font-size:14px;font-weight:500;}

/* Public-site preview */
#preview-backdrop{
  position:fixed;inset:0;background:rgba(20,26,24,.55);display:none;
  align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto;
}
#preview-backdrop.open{display:flex;}
.preview-modal{
  background:#FFFDF8;border-radius:14px;max-width:760px;width:100%;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.preview-topbar{
  background:var(--primary);color:#fff;padding:10px 22px;display:flex;justify-content:space-between;align-items:center;
  font-size:12px;letter-spacing:.04em;text-transform:uppercase;
}
.preview-topbar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;padding:5px 12px;}
.preview-topbar button:hover{background:rgba(255,255,255,.22);}
.preview-body{padding:32px 36px 36px;}
.preview-title{font-family:var(--font-display);font-size:28px;font-weight:600;margin:0 0 4px;color:var(--primary);}
.preview-daterange{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--accent-dark);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;}
.preview-subtitle{color:var(--muted);font-size:14px;margin:0 0 18px;}
.preview-price{font-family:var(--font-mono);font-size:22px;font-weight:500;color:var(--accent-dark);margin-bottom:4px;}
.preview-price-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:20px;}
.preview-section-title{font-family:var(--font-display);font-size:15px;font-weight:600;margin:22px 0 10px;color:var(--ink);}
.preview-cols{display:flex;gap:32px;flex-wrap:wrap;}
.preview-col{flex:1;min-width:220px;}
.preview-list{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;}
.preview-desc{font-size:13.5px;line-height:1.7;color:var(--ink);}
.preview-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
.preview-table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;}
.preview-table td{padding:8px;border-bottom:1px solid var(--line);}
.preview-badge{display:inline-block;background:var(--surface-2);border-radius:4px;padding:3px 8px;font-size:11.5px;font-family:var(--font-mono);}
.preview-footer-note{font-size:12px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:14px;}
.preview-species-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.preview-species-tags span{background:var(--surface-2);border-radius:20px;padding:3px 10px;font-size:12px;}
.series-badge-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink);}
.series-badge-btn:hover{background:var(--line);}

.listing-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px;}
.listing-tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:12.5px;}
.listing-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.listing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.listing-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;}
.listing-card-source{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-dark);margin-bottom:6px;font-weight:600;}
.listing-card-title{font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:4px;color:var(--primary);}
.listing-card-date{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.listing-card-price{font-size:14px;font-weight:500;color:var(--accent-dark);}
.picker-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:16px;}
.picker-row:last-child{border-bottom:none;}

/* 3D tour lightbox, opens on top of the package preview */
#tour-backdrop{
  position:fixed;inset:0;background:rgba(20,26,24,.7);display:none;
  align-items:center;justify-content:center;z-index:200;padding:30px;
}
#tour-backdrop.open{display:flex;}
.tour-modal{background:#000;border-radius:10px;overflow:hidden;width:100%;max-width:900px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.tour-modal .preview-topbar{background:var(--ink);}
.tour-iframe-wrap{position:relative;width:100%;padding-bottom:56.2%;}
.tour-iframe-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

/* Photo gallery lightbox */
#gallery-backdrop{
  position:fixed;inset:0;background:rgba(10,12,11,.85);display:none;
  align-items:center;justify-content:center;z-index:250;padding:30px;
}
#gallery-backdrop.open{display:flex;}
.gallery-modal{background:#000;border-radius:10px;overflow:hidden;width:100%;max-width:900px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.gallery-modal .preview-topbar{background:var(--ink);}
.gallery-nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px;line-height:1;}
.gallery-nav-btn:hover{background:rgba(0,0,0,.75);}
.gallery-thumb-strip{display:flex;gap:6px;padding:12px;overflow-x:auto;background:#111;}
.gallery-thumb-strip img{width:60px;height:44px;object-fit:cover;border-radius:4px;cursor:pointer;flex-shrink:0;}
.room-photo-thumb, .admin-photo-thumb{cursor:pointer;}

#toast-banner{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;
  font-size:13px;max-width:480px;box-shadow:0 8px 24px rgba(0,0,0,.3);
  z-index:300;display:none;
}
#toast-banner.open{display:block;}

.portal-shell{display:flex;min-height:640px;max-height:82vh;}
.portal-nav{width:220px;flex-shrink:0;background:linear-gradient(180deg,var(--primary) 0%,#1a302c 100%);color:#EFE9D8;padding:24px 16px;border-radius:14px 0 0 14px;display:flex;flex-direction:column;}
.portal-brand{font-family:var(--font-display);font-size:16px;font-weight:600;color:#fff;margin-bottom:6px;}
.portal-brand-sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#9FB0A8;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid rgba(239,233,216,.15);}
.portal-package-header{margin:-10px 0 16px;padding:10px 12px;background:rgba(255,255,255,.06);border-radius:8px;}
.portal-package-name{font-family:var(--font-display);font-size:13px;font-weight:600;color:#fff;line-height:1.3;}
.portal-package-dates{font-family:var(--font-mono);font-size:11px;color:var(--accent);margin-top:3px;}
.portal-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:500;color:#D6DED9;cursor:pointer;margin-bottom:3px;position:relative;}
.portal-nav-item:hover{background:rgba(255,255,255,.07);}
.portal-nav-item.active{background:rgba(255,255,255,.16);color:#fff;}
.portal-nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;opacity:.9;}
.portal-nav-check{margin-left:auto;font-size:11px;color:var(--accent);}
.portal-content{flex:1;overflow-y:auto;background:var(--bg);border-radius:0 14px 14px 0;}
.portal-hero{position:relative;height:190px;border-radius:0 14px 0 0;overflow:hidden;background:linear-gradient(135deg,var(--primary),#3a5c54);}
.portal-hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:.55;}
.portal-hero-overlay{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 30px;background:linear-gradient(0deg,rgba(20,26,24,.75),rgba(20,26,24,.1));}
.portal-hero-overlay h2{font-family:var(--font-display);color:#fff;font-size:28px;margin:0 0 4px;}
.portal-hero-overlay p{color:#EFE9D8;font-size:13px;margin:0;opacity:.9;}
.portal-body{padding:26px 32px;}
.portal-body h3{font-family:var(--font-display);font-size:19px;margin:0 0 6px;color:var(--primary);}
.portal-steps{display:flex;gap:8px;margin-bottom:22px;}
.portal-step{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:.02em;background:var(--surface-2);color:var(--muted);cursor:pointer;}
.portal-step.done{background:var(--ok-bg);color:var(--ok);}
.portal-step.current{background:var(--accent);color:#fff;}
.portal-section-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:16px;}
.portal-section-card h4{font-family:var(--font-display);font-size:14.5px;margin:0 0 14px;color:var(--ink);display:flex;align-items:center;gap:8px;}

#confirm-backdrop{
  position:fixed;inset:0;background:rgba(20,26,24,.55);display:none;
  align-items:center;justify-content:center;z-index:400;padding:20px;
}
#confirm-backdrop.open{display:flex;}
.confirm-modal{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.confirm-modal h4{font-family:var(--font-display);font-size:17px;margin:0 0 10px;color:var(--danger);}
.confirm-modal p{font-size:13.5px;color:var(--ink);margin:0 0 20px;line-height:1.5;}
.confirm-modal .close-row{border-top:none;padding-top:0;margin-top:0;}
</style>
</head>
<body>
<div id="app"></div>
<div id="preview-backdrop"></div>
<div id="tour-backdrop"></div>
<div id="gallery-backdrop"></div>
<div id="toast-banner"></div>
<div id="confirm-backdrop"></div>

<script>
const STORAGE_KEY = 'lodge-ops-core';

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function extractMatterportUrl(input){
  if(!input) return '';
  const trimmed = input.trim();

    if(a.priceDuringStay===undefined) a.priceDuringStay = a.pricePerPerson;
    if(a.priceDepartureDay===undefined) a.priceDepartureDay = a.pricePerPerson;
    if(a.description===undefined) a.description = '';
    if(!a.photos) a.photos = [];
    if(!a.videos) a.videos = [];
    return a;
  });
  const talonLodgeForActs = db.lodges.find(l=>l.name==='Talon Lodge & Spa');
  if(talonLodgeForActs){
    const NEW_ACTIVITIES = [
      { name:'Arrival Day Sportfishing', activityType:'Guide', duration:'Half Day', pricePerPerson:650, priceArrivalDay:650, priceDuringStay:null, priceDepartureDay:null, minPeople:1, capacity:0, description:'', photos:[], videos:[] },
      { name:'Freshwater Fishing by Boat Approach', activityType:'Excursion', duration:'Full Day', pricePerPerson:550, priceArrivalDay:550, priceDuringStay:550, priceDepartureDay:550, minPeople:2, capacity:6, description:'', photos:[], videos:[] },
      { name:'ATV Safari', activityType:'Excursion', duration:'Half Day', pricePerPerson:325, priceArrivalDay:325, priceDuringStay:325, priceDepartureDay:325, minPeople:2, capacity:6, description:'', photos:[], videos:[] },
      { name:'ATV Freshwater Fishing', activityType:'Excursion', duration:'Full Day', pricePerPerson:450, priceArrivalDay:450, priceDuringStay:450, priceDepartureDay:450, minPeople:2, capacity:6, description:'', photos:[], videos:[] }
    ];
    NEW_ACTIVITIES.forEach(na=>{
      const existingAct = db.activities.find(a=>a.lodgeId===talonLodgeForActs.id && a.name===na.name);
      if(!existingAct){
        db.activities.push({ id: uid('act'), lodgeId: talonLodgeForActs.id, ...na });
      } else if(na.name==='Freshwater Fishing by Boat Approach' && existingAct.capacity===0){
        // one-time correction: this activity is boat-based, capped at 6 people
        existingAct.capacity = 6;
        existingAct.minPeople = 2;
      }
    });
  }
  db.packages = (db.packages || []).map(p=>{
    if(!p.includeIds) p.includeIds = [];
    if(!p.excludeIds) p.excludeIds = [];
    if(!p.packageRooms) p.packageRooms = [];
    if(!p.packageActivities) p.packageActivities = [];
    if(!p.speciesIds) p.speciesIds = [];
    if(p.nights===undefined) p.nights = '';
    return p;
  });
}

async function load(){
  let needsSave = false;
  let loadedFromLegacyKey = false;
  try{
    const res = await window.storage.get(STORAGE_KEY);
    db = JSON.parse(res.value);
    needsSave = true;
  }catch(e){
    try{
      const legacy = await window.storage.get('lodge-ops-db');
      db = JSON.parse(legacy.value);
      loadedFromLegacyKey = true; // this blob still has photos inline — don't overwrite them below
      needsSave = true;
    }catch(e2){
      db = seedData();
      needsSave = true;
    }
  }
  patchDb();

  if(!loadedFromLegacyKey){
    for(const r of db.rooms){
      try{
        const pres = await window.storage.get(photoStorageKey(r.id));
        r.photos = JSON.parse(pres.value);
      }catch(e){
        // no dedicated photo key yet for this room — leave whatever patchDb set (normally [])
      }
    }
  }

  if(needsSave) await save();
  state.selectedLodgeId = db.lodges[0] ? db.lodges[0].id : null;
  render();
}

async function save(){
  try{
    // Core snapshot excludes room photo arrays entirely — those live in their own per-room
    // keys (see savePhotosForRoom) so photo growth can never threaten setup/booking data,
    // and so a routine save (editing a package, a lodge, etc.) never has to touch photos at all.
    const core = JSON.parse(JSON.stringify(db));
    core.rooms = core.rooms.map(r=>({ ...r, photos: [] }));
    const payload = JSON.stringify(core);
    if(payload.length > STORAGE_SOFT_LIMIT){
      showToast('This lodge\'s core data is approaching this demo\'s storage limit for a single key.');
    }
    const result = await window.storage.set(STORAGE_KEY, payload);
    if(!result){
      console.error('Storage save returned no result — data may not have been saved.');
      showToast('Save may not have completed — please check your changes are still there.');
      return false;
    }
    return true;
  }
  catch(e){
    console.error('save failed', e);
    showToast('Could not save — this demo\'s storage may be full. Try removing a photo and saving again.');
    return false;
  }
}

async function savePhotosForRoom(roomId){
  const room = db.rooms.find(r=>r.id===roomId);
  const photos = room ? (room.photos||[]) : [];
  try{
    const payload = JSON.stringify(photos);
    if(payload.length > STORAGE_SOFT_LIMIT){
      showToast('This room\'s photos are approaching this demo\'s per-room storage limit. Remove one and try again.');
    }
    const result = await window.storage.set(photoStorageKey(roomId), payload);
    if(!result){ showToast('This room\'s photos may not have saved — please check.'); return false; }
    return true;
  }catch(e){
    console.error('savePhotosForRoom failed', e);
    showToast('Could not save this room\'s photos — try removing one (especially an "Uploaded" one) and saving again.');
    return false;
  }
}

function showToast(message){
  const el = document.getElementById('toast-banner');
  if(!el) { console.warn('Toast:', message); return; }
  el.textContent = message;
  el.classList.add('open');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.classList.remove('open'); }, 8000);
}

function confirmAction(message, onConfirm){
  const backdrop = document.getElementById('confirm-backdrop');
  if(!backdrop){ onConfirm(); return; }
  backdrop.innerHTML = `
    <div class="confirm-modal">
      <h4>Are you sure?</h4>
      <p>${message}</p>
      <div class="close-row">
        <button id="confirm-cancel-btn">Cancel</button>
        <button class="primary" id="confirm-ok-btn" style="background:var(--danger);border-color:var(--danger);">Delete</button>
      </div>
    </div>
  `;
  backdrop.classList.add('open');
  const close = ()=>{ backdrop.classList.remove('open'); backdrop.innerHTML=''; };
  document.getElementById('confirm-cancel-btn').onclick = close;
  document.getElementById('confirm-ok-btn').onclick = ()=>{ close(); onConfirm(); };
  backdrop.onclick = (e)=>{ if(e.target===backdrop) close(); };
}

function currentLodge(){ return db.lodges.find(l=>l.id===state.selectedLodgeId); }

const STORAGE_SOFT_LIMIT = 4500000; // matches the warning threshold used in save()

function countUploadedPhotos(){
  let count = 0;
  (db.rooms||[]).forEach(r=>{ (r.photos||[]).forEach(p=>{ if(p && p.indexOf('data:')===0) count++; }); });
  return count;
}

function renderStorageMeter(){
  let coreSize = 0;
  try{
    const core = JSON.parse(JSON.stringify(db));
    core.rooms = (core.rooms||[]).map(r=>({ ...r, photos: [] }));
    coreSize = JSON.stringify(core).length;
  }catch(e){}
  const pct = Math.min(100, Math.round((coreSize / STORAGE_SOFT_LIMIT) * 100));
  const mb = (coreSize / 1000000).toFixed(2);
  const isHigh = pct >= 80;
  const uploadedCount = countUploadedPhotos();
  let uploadedBytes = 0;
  (db.rooms||[]).forEach(r=>{ (r.photos||[]).forEach(p=>{ if(p && p.indexOf('data:')===0) uploadedBytes += p.length; }); });
  const uploadedMB = (uploadedBytes/1000000).toFixed(2);
  return `
    <div style="margin-top:14px;">
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#9FB0A8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">
        <span>Core data used</span><span>${mb} MB</span>
      </div>
      <div style="height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${isHigh?'var(--danger)':'var(--accent)'};"></div>
      </div>
      <div style="font-size:10px;color:#9FB0A8;margin-top:6px;">Photos now stored per-room, separately (${uploadedMB} MB uploaded across ${uploadedCount} photo${uploadedCount===1?'':'s'}) — they no longer count against this bar.</div>
      ${uploadedCount>0 ? `
        <button id="cleanup-photos-btn" class="small" style="margin-top:6px;width:100%;">Remove uploaded photos</button>
        <div id="cleanup-photos-status" style="font-size:10.5px;color:#9FB0A8;margin-top:4px;"></div>
      ` : ''}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(239,233,216,.15);">
        <button id="export-backup-btn" class="small" style="width:100%;margin-bottom:6px;">⬇ Download full backup</button>
        <label for="import-backup-file" style="display:block;">
          <span class="small" style="width:100%;display:block;text-align:center;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff;color:var(--ink);font-weight:500;font-size:13px;">⬆ Restore from backup</span>
        </label>
        <input type="file" id="import-backup-file" accept=".json" style="display:none;">
        <div id="backup-status" style="font-size:10.5px;color:#9FB0A8;margin-top:4px;"></div>
      </div>
    </div>
  `;
}

function lodgeName(id){ const l=db.lodges.find(x=>x.id===id); return l?l.name:'—'; }
function fmt$(n){ if(n===null||n===undefined||n==='') return '—'; return '$'+Number(n).toLocaleString(); }
function fmtMinMaxPeople(min, max){
  const hasMin = min!==null && min!==undefined && min!=='';
  const hasMax = max!==null && max!==undefined && max!=='' && Number(max)!==0;
  if(hasMin && hasMax) return `Min ${min} / Max ${max} people`;
  if(hasMin) return `Min ${min} people`;
  if(hasMax) return `Max ${max} people`;
  return '—';
}

const CONTOUR_SVG = `<svg class="contour" viewBox="0 0 200 22" preserveAspectRatio="none"><path d="M0 14 Q 20 4 40 14 T 80 14 T 120 14 T 160 14 T 200 14" fill="none" stroke="#EFE9D8" stroke-width="1"/><path d="M0 19 Q 20 11 40 19 T 80 19 T 120 19 T 160 19 T 200 19" fill="none" stroke="#EFE9D8" stroke-width="1"/></svg>`;

function render(){
  const app = document.getElementById('app');
  const navItems = [
    ['lodges','Lodges'],['lodgeTypes','Lodge Types'],['rooms','Rooms'],['activities','Activities'],
    ['categories','Adventure categories'],['series','Special Series'],['packages','Packages'],
    ['inquiries','Inquiries'],['reservationRequests','Reservation Requests'],['brochureRequests','Brochure Requests'],['groups','Groups & Guest Lists'],['guests','Guests'],['leads','Leads']
  ];
  app.innerHTML = `
    <div id="sidebar">
      <div class="brand">
        <h1>Lodge Ops</h1>
        <p>Setup console</p>
        ${CONTOUR_SVG}
      </div>
      <nav>
        ${navItems.map(([key,label])=>`
          <div class="nav-item ${state.tab===key?'active':''}" data-nav="${key}">
            <span class="nav-dot"></span>${label}
          </div>`).join('')}
      </nav>
      <div class="sidebar-footer">
        <div class="lodge-switch">Active lodge</div>
        <select id="lodge-switcher">
          ${db.lodges.map(l=>`<option value="${l.id}" ${l.id===state.selectedLodgeId?'selected':''}>${l.name}</option>`).join('')}
        </select>
        ${renderStorageMeter()}
      </div>
    </div>
    <div id="main">${renderPage()}</div>
  `;
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.nav; state.editing=null; render(); };
  });
  const switcher = document.getElementById('lodge-switcher');
  if(switcher) switcher.onchange = (e)=>{ state.selectedLodgeId = e.target.value; render(); };
  const cleanupBtn = document.getElementById('cleanup-photos-btn');
  if(cleanupBtn){
    cleanupBtn.onclick = ()=>{
      const statusEl = document.getElementById('cleanup-photos-status');
      if(cleanupBtn.dataset.armed==='1'){
        let removed = 0;
        const touchedRoomIds = [];
        (db.rooms||[]).forEach(r=>{
          const before = (r.photos||[]).length;
          r.photos = (r.photos||[]).filter(p=>!(p && p.indexOf('data:')===0));
          const diff = before - r.photos.length;
          removed += diff;
          if(diff>0) touchedRoomIds.push(r.id);
        });
        Promise.all(touchedRoomIds.map(id=>savePhotosForRoom(id))).then(()=>{
          if(statusEl) statusEl.textContent = `Removed ${removed} uploaded photo${removed===1?'':'s'}.`;
          render();
        });
      } else {
        cleanupBtn.dataset.armed = '1';
        cleanupBtn.textContent = 'Click again to confirm';
        if(statusEl) statusEl.textContent = 'This deletes every uploaded (non-URL) photo — cannot be undone.';
        setTimeout(()=>{ if(cleanupBtn){ cleanupBtn.dataset.armed='0'; cleanupBtn.textContent='Remove uploaded photos'; } }, 4000);
      }
    };
  }

  const exportBtn = document.getElementById('export-backup-btn');
  if(exportBtn) exportBtn.onclick = ()=>{
    try{
      const payload = JSON.stringify(db, null, 2);
      const blob = new Blob([payload], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      a.href = url;
      a.download = `lodge-ops-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      const statusEl = document.getElementById('backup-status');
      if(statusEl) statusEl.textContent = 'Backup downloaded.';
    }catch(e){
      console.error('Export failed', e);
      showToast('Could not create backup — see console for details.');
    }
  };

  const importInput = document.getElementById('import-backup-file');
  if(importInput) importInput.onchange = async ()=>{
    const file = importInput.files && importInput.files[0];
    if(!file) return;
    const statusEl = document.getElementById('backup-status');
    confirmAction('Restore from this backup file? This replaces all current data in this session.', async ()=>{
      try{
        const text = await file.text();
        const restored = JSON.parse(text);
        db = restored;
        patchDb();
        await save();
        for(const r of db.rooms){ await savePhotosForRoom(r.id); }
        if(statusEl) statusEl.textContent = 'Backup restored.';
        showToast('Backup restored successfully.');
        render();
      }catch(e){
        console.error('Import failed', e);
        showToast('Could not restore that file — make sure it\'s a valid backup JSON.');
      }
    });
    importInput.value = '';
  };

  attachPageHandlers();
}

function getAffiliatedLodges(lodgeId){
  const ids = db.affiliations
    .filter(a=>a.lodgeA===lodgeId || a.lodgeB===lodgeId)
    .map(a=> a.lodgeA===lodgeId ? a.lodgeB : a.lodgeA);
  return db.lodges.filter(l=>ids.includes(l.id));
}

function cloneLodgePackage(sourcePkg, targetLodgeId){

    categoryId: sourcePkg.categoryId,

function computeNextDepartureDate(p){
  if(!p.arrivalStart) return '';
  const start = new Date(p.arrivalStart+'T00:00:00');
  const nights = Number(p.nights)||0;
  start.setDate(start.getDate()+nights);
  const yyyy = start.getFullYear();
  const mm = String(start.getMonth()+1).padStart(2,'0');
  const dd = String(start.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

  const dateRange = formatPackageDateRange(p);

  return `

        }))

    packageActivities: (sourcePkg.packageActivities||[]).map(pa=>({...pa}))
  };
}

/* ---------- GUEST MATCHING ENGINE ---------- */
function normalizeEmail(e){ return (e||'').trim().toLowerCase(); }
function normalizePhone(p){ return (p||'').replace(/\D/g,''); }

function namesEquivalent(a, b){
  a = (a||'').trim().toLowerCase();
  b = (b||'').trim().toLowerCase();
  if(!a || !b) return false;
  if(a===b) return true;
  return db.nicknameAliases.some(group=>{
    const set = [group.canonical.toLowerCase(), ...group.aliases.map(x=>x.toLowerCase())];
    return set.includes(a) && set.includes(b);
  });
}

function guestHasEmail(guest, email){
  const norm = normalizeEmail(email);
  return norm && guest.emails.some(e=>normalizeEmail(e.value)===norm);
}
function guestHasPhone(guest, phone){
  const norm = normalizePhone(phone);
  return norm && guest.phones.some(p=>normalizePhone(p.value)===norm);
}

function addEmailIfNew(guest, email){
  if(!email) return;
  const norm = normalizeEmail(email);
  if(norm && !guest.emails.some(e=>normalizeEmail(e.value)===norm)){
    guest.emails.push({ value: email, primary: guest.emails.length===0 });
  }
}
function addPhoneIfNew(guest, phone){
  if(!phone) return;
  const norm = normalizePhone(phone);
  if(norm && !guest.phones.some(p=>normalizePhone(p.value)===norm)){
    guest.phones.push({ value: phone, primary: guest.phones.length===0 });
  }
}
function addAliasIfNew(guest, firstName){
  if(!firstName) return;
  const norm = firstName.trim();
  if(norm && norm.toLowerCase()!==guest.firstName.toLowerCase() && !guest.nameAliases.some(a=>a.toLowerCase()===norm.toLowerCase())){
    guest.nameAliases.push(norm);
  }
}

// Attempts to match a candidate {firstName,lastName,email,phone} against existing guests.
// Returns { guestId, status: 'auto'|'review'|'new', tier, candidateGuestId, reason }
function matchGuest(candidate){
  const email = candidate.email;
  const phone = candidate.phone;

  // Tier 1: exact email match — auto
  let g = email && db.guests.find(x=>guestHasEmail(x, email));
  if(g) return { guestId:g.id, status:'auto', tier:1, reason:'Exact email match.' };

  // Tier 2: exact phone match + equivalent name — auto
  if(phone){
    g = db.guests.find(x=> guestHasPhone(x, phone)
      && namesEquivalent(x.firstName, candidate.firstName)
      && x.lastName.trim().toLowerCase()===(candidate.lastName||'').trim().toLowerCase());
    if(g) return { guestId:g.id, status:'auto', tier:2, reason:'Exact phone match with matching name.' };
  }

  // Tier 3: nickname-equivalent name + same last name, but no corroborating email/phone — review only
  g = db.guests.find(x=> namesEquivalent(x.firstName, candidate.firstName)
    && x.lastName.trim().toLowerCase()===(candidate.lastName||'').trim().toLowerCase());
  if(g){
    return { guestId:null, status:'review', tier:3, candidateGuestId:g.id,
      reason:`Name "${candidate.firstName} ${candidate.lastName}" is a nickname match for existing guest "${g.firstName} ${g.lastName}," but email and phone are both different.` };
  }

  // No signal at all — treat as a genuinely new guest
  return { guestId:null, status:'new', tier:null };
}

// Applies a match result: links to an existing guest (tier 1/2), creates a new guest
// and queues a review (tier 3), or simply creates a new guest (no match at all).
// sourceType/sourceId identify what triggered this (inquiry, reservationRequest, guestListEntry).
function resolveGuestForCandidate(candidate, sourceType, sourceId){
  const result = matchGuest(candidate);

  if(result.status==='auto'){
    const guest = db.guests.find(x=>x.id===result.guestId);
    const survivorBefore = {
      nameAliases: JSON.parse(JSON.stringify(guest.nameAliases)),
      emails: JSON.parse(JSON.stringify(guest.emails)),
      phones: JSON.parse(JSON.stringify(guest.phones))
    };
    addEmailIfNew(guest, candidate.email);
    addPhoneIfNew(guest, candidate.phone);
    addAliasIfNew(guest, candidate.firstName);
    guest.mergeHistory.push({
      id: uid('merge'), kind:'auto',
      candidateSnapshot: JSON.parse(JSON.stringify(candidate)),
      survivorSnapshotBefore: survivorBefore,
      repointedSourceType: sourceType, repointedSourceId: sourceId,
      tier: result.tier, mergedAt: new Date().toISOString().slice(0,10),
      rule: result.reason, undone:false
    });
    return { guestId: guest.id, matchStatus:'auto', matchTier: result.tier };
  }

  // Tier 3 (review) or no match at all — either way, create a new guest so the
  // intake record has somewhere to live; a Tier 3 review also queues a possible-duplicate flag.
  const newGuest = {
    id: uid('guest'), firstName: candidate.firstName, lastName: candidate.lastName, nameAliases:[],
    emails: candidate.email ? [{ value: candidate.email, primary:true }] : [],
    phones: candidate.phone ? [{ value: candidate.phone, primary:true }] : [],
    city:'', state:'', country:'', createdAt: new Date().toISOString().slice(0,10),
    sourceFirstSeen: sourceType, mergeHistory:[]
  };
  db.guests.push(newGuest);

  if(result.status==='review'){
    db.mergeReviewQueue.push({
      id: uid('mrq'), sourceType, sourceId, candidateGuestId: result.candidateGuestId,
      reason: result.reason, createdAt: new Date().toISOString().slice(0,10), status:'pending'
    });
    return { guestId: newGuest.id, matchStatus:'review', matchTier: result.tier };
  }

  return { guestId: newGuest.id, matchStatus:'new', matchTier: null };
}

function seriesRateIncrease(p){
  const s = db.packageSeries.find(x=>x.id===p.seriesId);
  return (s && s.rateIncreasePerPerson) ? Number(s.rateIncreasePerPerson) : 0;
}

function computePackagePriceSummary(p){
  const pkgLodge = db.lodges.find(l=>l.id===p.lodgeId);
  const pricingMode = p.pricingMode || (pkgLodge?pkgLodge.pricingMode:'flat');
  const increase = seriesRateIncrease(p);
  const bookedRoomIds = db.bookings.filter(b=>b.packageId===p.id).map(b=>b.roomId);
  const rows = (p.packageRooms||[]).map(pr=>{
    const room = db.rooms.find(r=>r.id===pr.roomId);
    if(!room) return null;
    const baseRate = pricingMode==='flat' ? pr.ratePerPerson : (pr.rateAdult||pr.ratePerPerson);
    const rate = (baseRate!==null && baseRate!==undefined && baseRate!=='') ? Number(baseRate)+increase : baseRate;
    const minOcc = pr.occMinOverride!==null && pr.occMinOverride!=='' && pr.occMinOverride!==undefined ? pr.occMinOverride : room.occMin;
    return { rate, minOcc, available: !bookedRoomIds.includes(room.id) };
  }).filter(Boolean);
  const avail = rows.filter(r=>r.available);
  const use = avail.length ? avail : rows;
  const prices = use.map(r=>r.rate).filter(x=>x!==null && x!==undefined && x!=='' && !isNaN(x));
  const min = prices.length?Math.min(...prices):null;
  const max = prices.length?Math.max(...prices):null;
  const minPeople = use.length ? Math.min(...use.map(r=>r.minOcc)) : null;
  const priceLabel = (avail.length===0 && rows.length>0)
    ? 'Sold out'
    : (min===null ? 'Contact for pricing' : (min===max ? fmt$(min)+' / person' : fmt$(min)+' – '+fmt$(max)+' / person'));
  return { priceLabel, minPeople };
}

function packageListingGroup(p, primaryLodgeId){
  if(p.lodgeId !== primaryLodgeId){
    const l = db.lodges.find(x=>x.id===p.lodgeId);
    return l ? l.name+' Packages' : 'Other Packages';
  }
  const s = db.packageSeries.find(x=>x.id===p.seriesId);
  return s ? s.name+' Packages' : 'Standard Packages';
}

function slugifyTab(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function buildPackageListPreviewHTML(lodge){
  const ownPackages = db.packages.filter(p=>p.lodgeId===lodge.id && p.status==='published');

  const affiliatedPackages = db.packages.filter(p=>affiliatedLodgeIds.includes(p.lodgeId) && p.status==='published');

  return `

    </div>
  `;
}

function formatPackageDateRange(p){
  if(!p.arrivalStart) return '';
  const start = new Date(p.arrivalStart+'T00:00:00');
  const nights = Number(p.nights)||0;
  const end = new Date(start);
  end.setDate(end.getDate()+nights);
  const startYear = start.getFullYear();
  const startMonth = start.toLocaleString('en-US',{month:'long'});
  const startDay = start.getDate();
  const startDow = start.toLocaleString('en-US',{weekday:'long'});
  const endYear = end.getFullYear();
  const endMonth = end.toLocaleString('en-US',{month:'long'});
  const endDay = end.getDate();
  const endDow = end.toLocaleString('en-US',{weekday:'long'});
  let dateLabel;
  if(!nights) dateLabel = `${startYear} ${startMonth} ${startDay}`;
  else if(startYear===endYear && startMonth===endMonth) dateLabel = `${startYear} ${startMonth} ${startDay}-${endDay}`;
  else if(startYear===endYear) dateLabel = `${startYear} ${startMonth} ${startDay} - ${endMonth} ${endDay}`;
  else dateLabel = `${startYear} ${startMonth} ${startDay} - ${endYear} ${endMonth} ${endDay}`;
  const dowLabel = nights ? ` (${startDow} Arrival - ${endDow} Departure)` : ` (${startDow} Arrival)`;
  return dateLabel + dowLabel;
}

function packageStayTitle(p){
  const nights = p.nights || '';
  const days = p.adventureDaysMax || p.adventureDaysMin || '';
  const cat = db.categories.find(c=>c.id===p.categoryId);
  const catName = cat ? cat.name : 'Lodging';
  const stayLabel = nights && days ? `${nights}-Night/${days}-Day ` : (nights ? `${nights}-Night ` : (days ? `${days}-Day ` : ''));
  return `${stayLabel}${catName} Package`;
}

function autoTitle(p){
  const start = p.arrivalStart ? new Date(p.arrivalStart+'T00:00:00') : null;
  if(!start) return 'Untitled package';
  const year = start.getFullYear();
  const month = start.toLocaleString('en-US',{month:'long'});
  const day = start.getDate();
  return `${year} ${month} ${day} ${packageStayTitle(p)}`;
}

function buildPackagePreviewHTML(p, lodge){
  const cat = db.categories.find(c=>c.id===p.categoryId);
  const pricingMode = p.pricingMode || lodge.pricingMode;
  const lodgeRooms = db.rooms;
  const lodgeActs = db.activities.filter(a=>a.lodgeId===lodge.id);

  const bookedRoomIds = db.bookings.filter(b=>b.packageId===p.id).map(b=>b.roomId);
  const seriesIncrease = seriesRateIncrease(p);
  const roomRows = p.packageRooms.map(pr=>{
    const room = lodgeRooms.find(r=>r.id===pr.roomId);
    if(!room) return null;
    const min = pr.occMinOverride!==null && pr.occMinOverride!=='' && pr.occMinOverride!==undefined ? pr.occMinOverride : room.occMin;
    const max = pr.occMaxOverride!==null && pr.occMaxOverride!=='' && pr.occMaxOverride!==undefined ? pr.occMaxOverride : room.occMax;
    const baseRate = pricingMode==='flat' ? pr.ratePerPerson : (pr.rateAdult||pr.ratePerPerson);
    const rate = (baseRate!==null && baseRate!==undefined && baseRate!=='') ? Number(baseRate)+seriesIncrease : baseRate;
    const available = !bookedRoomIds.includes(room.id);
    return { name: room.name, min, max, rate, matterportUrl: room.matterportUrl||'', available, photos: room.photos||[], description: room.description||'', bedrooms: room.bedrooms, bathrooms: room.bathrooms, bedConfiguration: room.bedConfiguration||'' };
  }).filter(Boolean);

  const availableRows = roomRows.filter(r=>r.available);
  const pricingRows = availableRows.length ? availableRows : roomRows;
  const prices = pricingRows.map(r=>r.rate).filter(x=>x!==null && x!=='' && x!==undefined && !isNaN(x));
  const min = prices.length?Math.min(...prices):null;
  const max = prices.length?Math.max(...prices):null;
  const priceLabel = availableRows.length===0 && roomRows.length>0
    ? 'Currently sold out'
    : (min===null ? 'Contact for pricing' : (min===max ? fmt$(min)+' / person' : fmt$(min)+' – '+fmt$(max)+' / person'));
  const minPeople = pricingRows.length ? Math.min(...pricingRows.map(r=>r.min)) : null;

  const includeLabels = (p.includeIds||[]).map(id=>{ const t = db.featureTags.find(x=>x.id===id); return t?t.label:null; }).filter(Boolean);
  const excludeLabels = (p.excludeIds||[]).map(id=>{ const t = db.featureTags.find(x=>x.id===id); return t?t.label:null; }).filter(Boolean);
  const speciesNames = (p.speciesIds||[]).map(id=>{ const s = db.species.find(x=>x.id===id); return s?s.name:null; }).filter(Boolean);

  const depositLabel = pricingMode==='flat'
    ? (p.depositAmount ? fmt$(p.depositAmount)+' per person' : '—')
    : (p.depositAdult ? fmt$(p.depositAdult)+' per adult'+(p.depositChild?', '+fmt$(p.depositChild)+' per child':'') : '—');

  const addOnActs = (p.packageActivities||[]).filter(pa=>!pa.included).map(pa=>{
    const act = lodgeActs.find(a=>a.id===pa.activityId);
    if(!act) return null;
    const priceLabel = pa.ratePerPerson?fmt$(pa.ratePerPerson)+' / person':'price on request';
    const minMaxLabel = fmtMinMaxPeople(act.minPeople, act.capacity);
    return `${act.name} — ${priceLabel}${minMaxLabel!=='—'?' ('+minMaxLabel+')':''}`;
  }).filter(Boolean);

  const includedActs = (p.packageActivities||[]).filter(pa=>pa.included).map(pa=>{
    const act = lodgeActs.find(a=>a.id===pa.activityId);
    return act ? act.name : null;
  }).filter(Boolean);

  const dateRange = formatPackageDateRange(p);

  return `
    <div class="preview-topbar">
      <span>Live preview — ${lodge.name}</span>
      <button id="close-preview">Close ✕</button>
    </div>
    <div class="preview-body">
      ${dateRange ? `<div class="preview-daterange">${dateRange}</div>` : ''}
      <h1 class="preview-title">${p.titleOverride || packageStayTitle(p)}</h1>
      ${(()=>{ const s = db.packageSeries.find(x=>x.id===p.seriesId); return s ? `
        <div style="margin-bottom:14px;">
          <button type="button" class="series-badge-btn" id="series-badge-toggle">${s.name} <span style="opacity:.6;">ⓘ</span></button>
          <div id="series-desc-panel" class="hint" style="display:none;margin-top:8px;max-width:480px;">${s.description || 'No additional details have been added for this series yet.'}</div>
        </div>
      ` : ''; })()}
      <div class="preview-price">${priceLabel}</div>
      <div class="preview-price-label">Prices Range ${minPeople!==null?'· Min '+minPeople+' people':''}</div>

      <div class="preview-cols">
        <div class="preview-col">
          <div class="preview-section-title">Package includes</div>
          ${includeLabels.length ? `<ul class="preview-list">${includeLabels.map(l=>`<li>${l}</li>`).join('')}</ul>` : '<p class="preview-desc">—</p>'}
          ${includedActs.length ? `<ul class="preview-list">${includedActs.map(l=>`<li>${l} (included)</li>`).join('')}</ul>` : ''}
        </div>
        <div class="preview-col">
          <div class="preview-section-title">Package does not include</div>
          ${excludeLabels.length ? `<ul class="preview-list">${excludeLabels.map(l=>`<li>${l}</li>`).join('')}</ul>` : '<p class="preview-desc">—</p>'}
        </div>
      </div>

      ${speciesNames.length ? `
        <div class="preview-section-title">Target species</div>
        <div class="preview-species-tags">${speciesNames.map(s=>`<span>${s}</span>`).join('')}</div>
      ` : ''}

      <div class="preview-section-title">Accommodations</div>
      ${roomRows.length ? `
        <table class="preview-table">
          <thead><tr><th>Room</th><th>Photos</th><th>Minimum Occupancy</th><th>Rate / person</th><th>Availability</th><th>Tour</th></tr></thead>
          <tbody>
            ${roomRows.map((r,i)=>`
              <tr${r.available?'':' style="opacity:.55;"'}>
                <td>${r.name} <button type="button" class="small ghost room-desc-toggle-btn" data-desc-target="room-desc-${i}" title="Room description">ⓘ</button></td>
                <td>${r.photos.length ? `<div style="display:flex;gap:4px;">${r.photos.slice(0,3).map((url,pi)=>`<img src="${url}" class="room-photo-thumb" data-photos-b64="${btoa(encodeURIComponent(JSON.stringify(r.photos)))}" data-photo-index="${pi}" style="width:44px;height:32px;object-fit:cover;border-radius:4px;border:1px solid var(--line);" onerror="this.style.display='none';">`).join('')}${r.photos.length>3?`<span class="hint room-photo-thumb" data-photos-b64="${btoa(encodeURIComponent(JSON.stringify(r.photos)))}" data-photo-index="3" style="align-self:center;cursor:pointer;">+${r.photos.length-3}</span>`:''}</div>` : '<span class="hint">—</span>'}</td>
                <td>${r.min} People</td>
                <td>${r.rate!==null&&r.rate!==undefined&&r.rate!==''?fmt$(r.rate):'—'}</td>
                <td>${r.available?'<span class="badge badge-ok">Available</span>':'<span class="badge badge-archived">Not Available</span>'}</td>
                <td>${r.matterportUrl?`<button type="button" class="small ghost view-tour-btn" data-tour-url="${r.matterportUrl}">3D Tour ↗</button>`:'—'}</td>
              </tr>
              <tr id="room-desc-${i}" style="display:none;">
                <td colspan="6" style="background:var(--surface-2);">
                  <div style="font-family:var(--font-display);font-weight:600;font-size:14px;margin-bottom:4px;">${r.name}</div>
                  <div class="hint" style="margin-bottom:6px;">
                    ${r.bedrooms?`${r.bedrooms} Bedroom${r.bedrooms==1?'':'s'}`:''}${r.bedrooms&&r.bathrooms?' · ':''}${r.bathrooms?`${r.bathrooms} Bathroom${r.bathrooms==1?'':'s'}`:''}${(r.bedrooms||r.bathrooms)&&r.bedConfiguration?' · ':''}${r.bedConfiguration||''}
                    ${(!r.bedrooms && !r.bathrooms && !r.bedConfiguration) ? 'No bedroom/bathroom details added yet.' : ''}
                  </div>
                  <div class="hint">${r.description || 'No description added for this room yet.'}</div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : `<p class="preview-desc">No rooms linked yet.</p>`}

      ${addOnActs.length ? `
        <div class="preview-section-title">Optional add-ons</div>
        <ul class="preview-list">${addOnActs.map(l=>`<li>${l}</li>`).join('')}</ul>
      ` : ''}

      ${p.description ? `
        <div class="preview-section-title">About this package</div>
        <p class="preview-desc">${p.description}</p>
      ` : ''}

      <div class="preview-footer-note">
        Deposit required: <span class="preview-badge">${depositLabel}</span>
        &nbsp; Status: <span class="preview-badge">${p.status}</span>
        ${p.status!=='published' ? ' — not visible on the live site until published.' : ''}
      </div>
    </div>
  `;
}

function guestLabel(guestId){
  const g = db.guests.find(x=>x.id===guestId);
  if(!g) return '—';
  return `${g.firstName} ${g.lastName}`;
}
function matchBadge(status, tier){
  if(status==='auto') return `<span class="badge badge-ok">Auto-matched (Tier ${tier})</span>`;
  if(status==='review') return `<span class="badge badge-archived">Needs review (Tier ${tier})</span>`;
  return `<span class="badge badge-draft">New guest</span>`;
}

/* ---------- LEADS (search + 360 view) ---------- */
function detectDelimiter(text){
  const firstLine = text.split(/\r?\n/)[0] || '';
  const tabCount = (firstLine.match(/\t/g)||[]).length;
  const commaCount = (firstLine.match(/,/g)||[]).length;
  return tabCount > commaCount ? '\t' : ',';
}

function parseCSV(text, delimiter){
  delimiter = delimiter || ',';
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===delimiter){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(c=>c.trim()!==''));
}

function findColumnIndex(headers, candidates){
  const norm = headers.map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]/g,''));
  for(const cand of candidates){
    const idx = norm.indexOf(cand);
    if(idx!==-1) return idx;
  }
  return -1;
}

function importGuestsFromCSV(csvText){
  const trimmed = csvText.trim();
  const delimiter = detectDelimiter(trimmed);
  const rows = parseCSV(trimmed, delimiter);
  if(rows.length < 2) return { total:0, auto:0, review:0, created:0, skipped:0 };
  const headers = rows[0];
  const firstIdx = findColumnIndex(headers, ['firstname','first']);
  const lastIdx = findColumnIndex(headers, ['lastname','last']);
  const emailIdx = findColumnIndex(headers, ['email','emailaddress']);
  const phoneIdx = findColumnIndex(headers, ['phone','phonenumber','tel']);

  let auto=0, review=0, created=0, skipped=0;
  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    const firstName = firstIdx!==-1 ? (row[firstIdx]||'').trim() : '';
    const lastName = lastIdx!==-1 ? (row[lastIdx]||'').trim() : '';
    const email = emailIdx!==-1 ? (row[emailIdx]||'').trim() : '';
    const phone = phoneIdx!==-1 ? (row[phoneIdx]||'').trim() : '';
    if(!firstName || !lastName){ skipped++; continue; }
    const resolved = resolveGuestForCandidate({ firstName, lastName, email, phone }, 'import', null);
    if(resolved.matchStatus==='auto') auto++;
    else if(resolved.matchStatus==='review'){
      review++; created++;
      const mrq = db.mergeReviewQueue.find(m=>m.sourceType==='import' && m.sourceId===null);
      if(mrq) mrq.sourceId = 'row-'+r;
    } else created++;
  }
  return { total: rows.length-1, auto, review, created, skipped };
}

          <span class="mono">${importResult.created}</span> new guest${importResult.created===1?'':'s'} created.
          ${importResult.skipped ? `<div class="hint" style="margin-top:4px;">${importResult.skipped} row(s) skipped (missing name).</div>` : ''}
        </div>
      ` : ''}
    </div>
    <div class="field" style="max-width:420px;">
      <label>Search by name</label>
      <input type="text" id="leads-search-input" placeholder="e.g. Chen, Robert, Bobby…" value="${state.leadsSearchQuery||''}">
    </div>
    ${resultsHtml}
    ${detail}
  `;
}

function getOrCreateProfile(guestId, groupId){
  let p = db.profiles.find(x=>x.guestId===guestId && x.groupId===groupId);
  if(!p){
    const group = db.groups.find(g=>g.id===groupId);
    const pkg = group ? db.packages.find(x=>x.id===group.packageId) : null;
    const prefillArrival = pkg && pkg.arrivalStart ? pkg.arrivalStart : (group ? group.arrivalDate : '');
    const prefillDeparture = pkg && pkg.arrivalStart ? computeDepartureDate(pkg.arrivalStart, pkg.nights) : '';
    p = {
      id: uid('profile'), guestId, groupId,
      addressLine1:'', addressLine2:'', city:'', state:'', zip:'', country:'',
      emergencyContactName:'', emergencyContactPhone:'',
      arrivalMode:'Alaska Airlines', arrivalFlightCode:'', arrivalTime:'', arrivalHotel:'', arrivalDate:prefillArrival,
      departureMode:'Alaska Airlines', departureFlightCode:'', departureTime:'', departureHotel:'', departureDate:prefillDeparture,
      leavingSitkaFlightCode:'', leavingSitkaTime:'', leavingSitkaDate:'',
      arrivalDepartureComments:'',
      bootSize:'', jacketSize:'', gender:'', age:'',
      hasFoodAllergies:false, foodAllergiesDescription:'',
      hasMedicalCondition:false, medicalConditionDescription:'',
      hasSpecialEvent:false, specialEventDescription:'',
      scheduledActivities: [], // [{activity, arrival:bool, duringStay:bool, departure:bool}]
      cartItems: [] // [{label, price}]
    };
    db.profiles.push(p);
  }
  return p;
}

function computeDepartureDate(arrivalStart, nights){
  if(!arrivalStart) return '';
  const start = new Date(arrivalStart+'T00:00:00');
  start.setDate(start.getDate() + (Number(nights)||0));
  return start.toISOString().slice(0,10);
}

function sectionComplete(p, section){
  if(section==='personal') return !!(p.addressLine1 && p.emergencyContactName && p.age && p.gender);
  if(section==='flights') return !!(p.arrivalFlightCode || p.arrivalMode==='Hotel / B & B') && !!(p.departureDate);
  if(section==='activities') return (p.scheduledActivities||[]).some(a=>a.arrival||a.duringStay||a.departure) || p._activitiesReviewed;
  return false;
}

function openGuestPortal(guestId, groupId, activeTab){
  activeTab = activeTab || 'home';
  const backdrop = document.getElementById('preview-backdrop');
  backdrop.innerHTML = `<div class="preview-modal" style="max-width:1020px;padding:0;overflow:hidden;">${buildGuestPortalHTML(guestId, groupId)}</div>`;
  backdrop.classList.add('open');
  backdrop.onclick = (e)=>{ if(e.target===backdrop){ backdrop.classList.remove('open'); backdrop.innerHTML=''; } };

  backdrop.querySelectorAll('.portal-nav-item').forEach(item=>{
    item.classList.toggle('active', item.dataset.portalTab===activeTab);
  });
  backdrop.querySelectorAll('.portal-pane').forEach(pane=>{
    pane.style.display = pane.dataset.portalPane===activeTab ? '' : 'none';
  });
  backdrop.querySelectorAll('.portal-nav-item, .portal-step').forEach(item=>{
    item.onclick = ()=>{
      backdrop.querySelectorAll('.portal-nav-item').forEach(x=>x.classList.remove('active'));
      const navMatch = backdrop.querySelector(`.portal-nav-item[data-portal-tab="${item.dataset.portalTab}"]`);
      if(navMatch) navMatch.classList.add('active');
      backdrop.querySelectorAll('.portal-pane').forEach(pane=>{
        pane.style.display = pane.dataset.portalPane===item.dataset.portalTab ? '' : 'none';
      });
    };
  });

  const closeBtn = document.getElementById('close-portal');

      profile.departureDate = g('pf-dep-date').value;
      profile.leavingSitkaFlightCode = g('pf-sitka-flight').value;
      profile.leavingSitkaTime = g('pf-sitka-time').value;
      profile.arrivalDepartureComments = g('pf-ad-comments').value;
      profile.bootSize = g('pf-boot').value;
      profile.jacketSize = g('pf-jacket').value;
      profile.gender = g('pf-gender').value;
      profile.age = g('pf-age').value;

        return {

          arrival: !!document.querySelector(`.pf-act-arrival[data-act="${name}"]`).checked,

async function generateActivityDescription(act, lodge){
  const brandContext = lodge.brandVoice && lodge.brandVoice.trim()
    ? lodge.brandVoice.trim()
    : `${lodge.name} is a lodging and adventure property. No specific brand voice has been set for this lodge yet — write in a warm, professional, generally upscale hospitality tone.`;

  const actContext = `Activity specifics:
- Name: ${act.name}
- Type: ${act.activityType}
- Duration: ${act.duration || 'not specified'}`;

  const prompt = `You are writing guest-facing copy for a lodge's website, describing one specific add-on activity/excursion.

Lodge voice and positioning:
${brandContext}

${actContext}

Write a 2-3 sentence description of this activity in that lodge's voice. Do not mention price. Return only the description text itself, with no preamble, quotation marks, or explanation.`;

  const requestBody = {
    model: "claude-sonnet-4-6",
    max_tokens: 250,
    messages: [{ role: "user", content: prompt }]
  };

  let response;
  try{
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestBody)
    });
  }catch(networkErr){
    throw new Error('Network error contacting AI service: ' + networkErr.message);
  }

  const raw = await response.text();
  let data;
  try{
    data = JSON.parse(raw);
  }catch(parseErr){
    throw new Error('AI service returned a non-JSON response: ' + raw.slice(0,200));
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data).slice(0,200);
    throw new Error('AI service error (' + response.status + '): ' + msg);
  }

  const text = (data.content || []).map(block => block.text || '').join('\n').trim();
  if(!text) throw new Error('AI service returned an empty response: ' + JSON.stringify(data).slice(0,200));
  return text;
}

function syncPackageForm(){
  if(!(state.editing && state.editing.type==='package')) return;
  const d = state.editing.data;
  const g = id => document.getElementById(id);
  if(g('f-title')) d.titleOverride = g('f-title').value;
  if(g('f-status')) d.status = g('f-status').value;
  if(g('f-arrival-start')) d.arrivalStart = g('f-arrival-start').value;
  if(g('f-arrival-end')) d.arrivalEnd = g('f-arrival-end').value;
  if(g('f-nights')) d.nights = g('f-nights').value;
  if(g('f-series')) d.seriesId = g('f-series').value || null;
  if(g('f-days-min')) d.adventureDaysMin = g('f-days-min').value;
  if(g('f-days-max')) d.adventureDaysMax = g('f-days-max').value;
  if(g('f-description')) d.description = g('f-description').value;
  if(document.querySelectorAll('.include-check').length) d.includeIds = Array.from(document.querySelectorAll('.include-check:checked')).map(el=>el.value);
  if(document.querySelectorAll('.exclude-check').length) d.excludeIds = Array.from(document.querySelectorAll('.exclude-check:checked')).map(el=>el.value);

  const pricingMode = d.pricingMode || currentLodge().pricingMode;
  if(pricingMode==='flat'){
    if(g('f-deposit')) d.depositAmount = g('f-deposit').value;
    if(g('f-surcharge')) d.surchargePerPerson = g('f-surcharge').value;
  } else {
    if(g('f-deposit-adult')) d.depositAdult = g('f-deposit-adult').value;
    if(g('f-deposit-child')) d.depositChild = g('f-deposit-child').value;
    if(g('f-surcharge-adult')) d.surchargeAdult = g('f-surcharge-adult').value;
    if(g('f-surcharge-child')) d.surchargeChild = g('f-surcharge-child').value;
  }

  if(document.querySelectorAll('.room-check').length){
    const rooms = [];
    document.querySelectorAll('.room-check').forEach(cb=>{
      if(cb.checked){
        const roomId = cb.dataset.roomId;
        if(pricingMode==='flat'){
          const rateEl = document.querySelector(`.room-rate[data-room-id="${roomId}"]`);
          rooms.push({ roomId, ratePerPerson: rateEl && rateEl.value!==''?Number(rateEl.value):null, occMinOverride:null, occMaxOverride:null });
        } else {
          const adultEl = document.querySelector(`.room-rate-adult[data-room-id="${roomId}"]`);
          const childEl = document.querySelector(`.room-rate-child[data-room-id="${roomId}"]`);
          rooms.push({ roomId, rateAdult: adultEl && adultEl.value!==''?Number(adultEl.value):null, rateChild: childEl && childEl.value!==''?Number(childEl.value):null, occMinOverride:null, occMaxOverride:null });
        }
      }
    });
    d.packageRooms = rooms;
  }

  if(document.querySelectorAll('.act-check').length){
    const acts = [];
    document.querySelectorAll('.act-check').forEach(cb=>{
      if(cb.checked){
        const actId = cb.dataset.actId;
        const rateEl = document.querySelector(`.act-rate[data-act-id="${actId}"]`);
        const incEl = document.querySelector(`.act-included[data-act-id="${actId}"]`);
        acts.push({ activityId: actId, ratePerPerson: rateEl && rateEl.value!==''?Number(rateEl.value):null, included: incEl?incEl.checked:false });
      }
    });
    d.packageActivities = acts;
  }
}

function videoEmbedHtml(url){
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if(yt) return `<iframe width="100%" height="220" src="https://www.youtube.com/embed/${yt[1]}" frameborder="0" allowfullscreen style="border-radius:8px;"></iframe>`;
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if(vimeo) return `<iframe width="100%" height="220" src="https://player.vimeo.com/video/${vimeo[1]}" frameborder="0" allowfullscreen style="border-radius:8px;"></iframe>`;
  return `<video width="100%" height="220" controls src="${url}" style="border-radius:8px;background:#000;"></video>`;
}

function handleActivityCheckboxChange(guestId, groupId, activityId, activityName){
  const profile = getOrCreateProfile(guestId, groupId);
  const act = db.activities.find(a=>a.id===activityId);
  const arrivalEl = document.querySelector(`.pf-act-arrival[data-act="${activityName}"]`);
  const duringEl = document.querySelector(`.pf-act-during[data-act="${activityName}"]`);
  const departureEl = document.querySelector(`.pf-act-departure[data-act="${activityName}"]`);
  const arrival = arrivalEl ? arrivalEl.checked : false;
  const duringStay = duringEl ? duringEl.checked : false;
  const departure = departureEl ? departureEl.checked : false;
  const anyChecked = arrival || duringStay || departure;

  if(!anyChecked){
    profile.scheduledActivities = profile.scheduledActivities.filter(s=>s.activity!==activityName);
    save();
    openGuestPortal(guestId, groupId, 'activities');
    return;
  }

  let entry = profile.scheduledActivities.find(s=>s.activity===activityName);
  if(!entry){
    entry = { activity: activityName, arrival, duringStay, departure, participants: [], status:'requested' };
    profile.scheduledActivities.push(entry);
  } else {
    entry.arrival = arrival; entry.duringStay = duringStay; entry.departure = departure;
    if(!entry.status) entry.status = 'requested';
  }

  if(act && act.minPeople && act.minPeople > 1){
    openActivityParticipantsModal(guestId, groupId, activityId, activityName);
  } else {
    save();
    openGuestPortal(guestId, groupId, 'activities');
  }
}

function openActivityParticipantsModal(guestId, groupId, activityId, activityName){
  const act = db.activities.find(a=>a.id===activityId);
  const profile = getOrCreateProfile(guestId, groupId);
  const entry = profile.scheduledActivities.find(s=>s.activity===activityName);
  const others = db.guestListEntries.filter(e=>e.groupId===groupId && e.guestId!==guestId);
  const minPeople = act ? act.minPeople : null;
  const maxPeople = act ? act.capacity : null;
  const selected = entry ? (entry.participants||[]) : [];

  const tourBackdrop = document.getElementById('tour-backdrop');
  tourBackdrop.innerHTML = `
    <div class="tour-modal" style="background:#fff;color:var(--ink);max-width:520px;">
      <div class="preview-topbar"><span>Who's joining ${activityName}?</span><button id="close-tour">Close ✕</button></div>
      <div style="padding:22px 26px;">
        <p class="hint" style="margin-bottom:14px;">
          ${minPeople?`This activity requires at least ${minPeople} people total`:''}${minPeople&&maxPeople?', and holds up to '+maxPeople+'.':(minPeople?'.':'')}
          ${!minPeople&&maxPeople?`This activity holds up to ${maxPeople} people.`:''}
          You're included as 1 — select who else from your group is joining.
        </p>
        ${others.length ? `
          <div class="tag-list">
            ${others.map(o=>`<label><input type="checkbox" class="party-member-check" value="${o.id}" ${selected.includes(o.id)?'checked':''}>${o.firstName} ${o.lastName}</label>`).join('')}
          </div>
        ` : `<div class="empty">No other guests are on this group's guest list yet.</div>`}
        <div id="party-modal-status" class="hint" style="color:var(--danger);margin-top:12px;"></div>
        <div class="close-row">
          <button id="cancel-party-modal">Cancel</button>
          <button class="primary" id="confirm-party-modal">Confirm</button>
        </div>
      </div>
    </div>
  `;
  tourBackdrop.classList.add('open');
  const close = ()=>{ tourBackdrop.classList.remove('open'); tourBackdrop.innerHTML=''; };
  document.getElementById('close-tour').onclick = close;
  document.getElementById('cancel-party-modal').onclick = close;
  document.getElementById('confirm-party-modal').onclick = ()=>{
    const chosen = Array.from(tourBackdrop.querySelectorAll('.party-member-check:checked')).map(el=>el.value);
    const totalParty = chosen.length + 1;
    const statusEl = document.getElementById('party-modal-status');
    if(minPeople && totalParty < minPeople){
      statusEl.textContent = `Please select at least ${minPeople-1} more people (${minPeople} total required).`;
      return;
    }
    if(maxPeople && totalParty > maxPeople){
      statusEl.textContent = `This activity holds a maximum of ${maxPeople} people — please select fewer.`;
      return;
    }
    const liveEntry = profile.scheduledActivities.find(s=>s.activity===activityName);
    if(liveEntry){
      liveEntry.participants = chosen;
      liveEntry.status = liveEntry.status || 'requested';
    }

    // propagate this same request into each selected companion's own profile, so it
    // shows up for them too — still pending lodge confirmation, same as the originator's
    const selfEntry = db.guestListEntries.find(e=>e.groupId===groupId && e.guestId===guestId);
    const fullParty = [ ...(selfEntry ? [selfEntry.id] : []), ...chosen ];
    chosen.forEach(companionEntryId=>{
      const companionGlEntry = db.guestListEntries.find(e=>e.id===companionEntryId);
      if(!companionGlEntry || !companionGlEntry.guestId) return;
      const companionProfile = getOrCreateProfile(companionGlEntry.guestId, groupId);
      let companionEntry = companionProfile.scheduledActivities.find(s=>s.activity===activityName);
      const othersForCompanion = fullParty.filter(id=>id!==companionEntryId);
      if(!companionEntry){
        companionEntry = { activity: activityName, arrival: liveEntry?liveEntry.arrival:false, duringStay: liveEntry?liveEntry.duringStay:false, departure: liveEntry?liveEntry.departure:false, participants: othersForCompanion, status:'requested' };
        companionProfile.scheduledActivities.push(companionEntry);
      } else {
        companionEntry.arrival = liveEntry ? liveEntry.arrival : companionEntry.arrival;
        companionEntry.duringStay = liveEntry ? liveEntry.duringStay : companionEntry.duringStay;
        companionEntry.departure = liveEntry ? liveEntry.departure : companionEntry.departure;
        companionEntry.participants = othersForCompanion;
        if(!companionEntry.status) companionEntry.status = 'requested';
      }
    });

    save();
    close();
    openGuestPortal(guestId, groupId, 'activities');
  };
}

function openPhotoGallery(photos, startIndex){
  if(!photos || !photos.length) return;
  let idx = startIndex || 0;
  const backdrop = document.getElementById('gallery-backdrop');
  function renderGallery(){
    backdrop.innerHTML = `<div class="gallery-modal">${buildPhotoGalleryHTML(photos, idx)}</div>`;
    backdrop.classList.add('open');
    document.getElementById('close-gallery').onclick = ()=>{ backdrop.classList.remove('open'); backdrop.innerHTML=''; };
    const prevBtn = document.getElementById('gallery-prev');
    const nextBtn = document.getElementById('gallery-next');
    if(prevBtn) prevBtn.onclick = ()=>{ idx = (idx-1+photos.length)%photos.length; renderGallery(); };
    if(nextBtn) nextBtn.onclick = ()=>{ idx = (idx+1)%photos.length; renderGallery(); };
    backdrop.querySelectorAll('.gallery-strip-thumb').forEach(t=>{
      t.onclick = ()=>{ idx = Number(t.dataset.galleryIndex); renderGallery(); };
    });
  }
  renderGallery();
}

function readAndCompressImage(file, maxDim, quality){
  maxDim = maxDim || 1200;
  quality = quality || 0.82;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let width = img.width, height = img.height;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Could not read image: ' + file.name));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file: ' + file.name));
    reader.readAsDataURL(file);
  });
}

    const mrq = db.mergeReviewQueue.find(m=>m.id===this.dataset.confirmMerge);
    const newGuestId = this.dataset.newGuestId;
    const candidateId = this.dataset.candidateId;
    if(!mrq || !newGuestId || !candidateId) return;
    const newGuest = db.guests.find(g=>g.id===newGuestId);
    const survivor = db.guests.find(g=>g.id===candidateId);
    if(!newGuest || !survivor) return;

    // snapshot survivor's exact state BEFORE this merge, so undo can restore it precisely
    const survivorBefore = {
      nameAliases: JSON.parse(JSON.stringify(survivor.nameAliases)),
      emails: JSON.parse(JSON.stringify(survivor.emails)),
      phones: JSON.parse(JSON.stringify(survivor.phones))
    };

    // fold the new (duplicate) guest's data into the survivor, keep full history
    addAliasIfNew(survivor, newGuest.firstName);
    (newGuest.emails||[]).forEach(e=>addEmailIfNew(survivor, e.value));
    (newGuest.phones||[]).forEach(p=>addPhoneIfNew(survivor, p.value));

    // record exactly which records get repointed, so undo only reverts these specific ones
    const repointed = {
      inquiryIds: db.inquiries.filter(i=>i.guestId===newGuest.id).map(i=>i.id),
      reservationRequestIds: db.reservationRequests.filter(r=>r.guestId===newGuest.id).map(r=>r.id),
      guestListEntryIds: db.guestListEntries.filter(e=>e.guestId===newGuest.id).map(e=>e.id),
      groupIds: db.groups.filter(g=>g.leadGuestId===newGuest.id).map(g=>g.id),
      communicationIds: db.communications.filter(c=>c.guestId===newGuest.id).map(c=>c.id)
    };

    const mergeId = uid('merge');
    survivor.mergeHistory.push({
      id: mergeId, kind:'manual',
      mergedGuestId: newGuest.id,
      mergedGuestSnapshot: JSON.parse(JSON.stringify(newGuest)),
      survivorSnapshotBefore: survivorBefore,
      repointed,
      mergeReviewQueueId: mrq.id,
      mergedAt: new Date().toISOString().slice(0,10),
      rule: 'manual-review-confirmed',
      undone: false
    });

    // repoint every record that referenced the duplicate guest over to the survivor
    db.inquiries.forEach(i=>{ if(i.guestId===newGuest.id) i.guestId = survivor.id; });
    db.reservationRequests.forEach(r=>{ if(r.guestId===newGuest.id) r.guestId = survivor.id; });
    db.guestListEntries.forEach(e=>{ if(e.guestId===newGuest.id) e.guestId = survivor.id; });
    db.groups.forEach(g=>{ if(g.leadGuestId===newGuest.id) g.leadGuestId = survivor.id; });
    db.communications.forEach(c=>{ if(c.guestId===newGuest.id) c.guestId = survivor.id; });

    db.guests = db.guests.filter(g=>g.id!==newGuest.id);
    mrq.status = 'merged';
    save(); render();
  });
  on('[data-reject-merge]', function(){
    const mrq = db.mergeReviewQueue.find(m=>m.id===this.dataset.rejectMerge);
    if(mrq) mrq.status = 'rejected';
    save(); render();
  });

  on('[data-undo-merge]', function(){
    const survivorId = this.dataset.survivorId;
    const mergeId = this.dataset.mergeId;
    const survivor = db.guests.find(g=>g.id===survivorId);
    if(!survivor) return;
    const entry = survivor.mergeHistory.find(m=>m.id===mergeId);
    if(!entry || entry.undone) return;

    // safety rule: only allow undoing the most recent, not-yet-undone merge on this guest,
    // to avoid inconsistent partial-undo when several merges have happened since
    const activeMerges = survivor.mergeHistory.filter(m=>!m.undone);
    const isLatest = activeMerges.length && activeMerges[activeMerges.length-1].id === entry.id;
    if(!isLatest){
      showToast('Can only undo the most recent merge on this guest — undo any later merges first.');
      return;
    }

    if(entry.kind==='auto'){
      // split the auto-matched record back out into its own new guest
      const c = entry.candidateSnapshot;
      const restoredGuest = {
        id: uid('guest'), firstName: c.firstName, lastName: c.lastName, nameAliases:[],
        emails: c.email ? [{ value: c.email, primary:true }] : [],
        phones: c.phone ? [{ value: c.phone, primary:true }] : [],
        city:'', state:'', country:'', createdAt: entry.mergedAt,
        sourceFirstSeen: entry.repointedSourceType, mergeHistory:[]
      };
      db.guests.push(restoredGuest);

      survivor.nameAliases = JSON.parse(JSON.stringify(entry.survivorSnapshotBefore.nameAliases));
      survivor.emails = JSON.parse(JSON.stringify(entry.survivorSnapshotBefore.emails));
      survivor.phones = JSON.parse(JSON.stringify(entry.survivorSnapshotBefore.phones));

      const st = entry.repointedSourceType, sid = entry.repointedSourceId;
      const repointMap = {
        inquiry: db.inquiries, reservationRequest: db.reservationRequests,
        brochureRequest: db.brochureRequests, guestListEntry: db.guestListEntries,
        import: null
      };
      const list = repointMap[st];
      if(list){ const r = list.find(x=>x.id===sid); if(r) r.guestId = restoredGuest.id; }
      db.communications.forEach(c=>{ if(c.sourceType===st && c.sourceId===sid) c.guestId = restoredGuest.id; });

      entry.undone = true;
      entry.undoneAt = new Date().toISOString().slice(0,10);
      save(); render();
      return;
    }

    // recreate the guest record exactly as it was before the merge
    const restoredGuest = JSON.parse(JSON.stringify(entry.mergedGuestSnapshot));
    db.guests.push(restoredGuest);

    // restore survivor's fields to their pre-merge state
    survivor.nameAliases = JSON.parse(JSON.stringify(entry.survivorSnapshotBefore.nameAliases));
    survivor.emails = JSON.parse(JSON.stringify(entry.survivorSnapshotBefore.emails));
    survivor.phones = JSON.parse(JSON.stringify(entry.survivorSnapshotBefore.phones));

    // repoint only the exact records this specific merge touched, back to the restored guest
    const rp = entry.repointed || {};
    (rp.inquiryIds||[]).forEach(id=>{ const r=db.inquiries.find(x=>x.id===id); if(r) r.guestId = restoredGuest.id; });
    (rp.reservationRequestIds||[]).forEach(id=>{ const r=db.reservationRequests.find(x=>x.id===id); if(r) r.guestId = restoredGuest.id; });
    (rp.guestListEntryIds||[]).forEach(id=>{ const r=db.guestListEntries.find(x=>x.id===id); if(r) r.guestId = restoredGuest.id; });
    (rp.groupIds||[]).forEach(id=>{ const r=db.groups.find(x=>x.id===id); if(r) r.leadGuestId = restoredGuest.id; });
    (rp.communicationIds||[]).forEach(id=>{ const r=db.communications.find(x=>x.id===id); if(r) r.guestId = restoredGuest.id; });

    // put the original review-queue decision back to pending, and mark this merge undone (never deleted, for audit)
    if(entry.mergeReviewQueueId){
      const mrq = db.mergeReviewQueue.find(m=>m.id===entry.mergeReviewQueueId);
      if(mrq) mrq.status = 'pending';
    }
    entry.undone = true;
    entry.undoneAt = new Date().toISOString().slice(0,10);

    save(); render();
  });
}

load();
</script>
</body>
