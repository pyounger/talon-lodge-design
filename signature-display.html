<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talon Lodge — Evening Display</title><style>html,body{margin:0;background:#0c0a07}</style></head><body>
<style>
  :root{
    --bg:#0d0b07; --kraft1:#c0925c; --kraft2:#8a6238; --kraft3:#6f4d2c;
    --cream:#f6edda; --cream-dim:#e7dcc4; --faint:#b39c78; --gold:#e7b657;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Semibold","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden}
  .stage{position:fixed;inset:0}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex}
  .slide.on{opacity:1;z-index:1}
  .emptymsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cream-dim);font-size:2.4vh;padding:6vh;z-index:2}
  /* ---- breakfast (kraft) slide ---- */
  .bk{background:radial-gradient(120% 90% at 20% 0%, #2b1c11 0%, var(--bg) 60%)}
  .bk .hero{position:relative;flex:0 0 55%;overflow:hidden;background:linear-gradient(160deg,#3a2717,#20140b)}
  .bk .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .bk .hero .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:6%}
  .bk .hero .fallback .plate{font-size:12vh;opacity:.5}.bk .hero .fallback .fn{font:700 3.4vh/1.15 var(--serif);color:var(--cream-dim);max-width:80%}
  .bk .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 26%)}
  .bk .brandmark{position:absolute;top:4.5vh;left:4vh;z-index:2}
  .bk .brandmark .bt{font:800 1.7vh/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--cream)}
  .bk .brandmark .bs{font:600 1.35vh/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:1vh}
  .bk .menu{flex:1 1 45%;position:relative;padding:6.5vh 5.5vh 5vh;display:flex;flex-direction:column;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, rgba(0,0,0,0) 2px 6px),linear-gradient(150deg, var(--kraft1) 0%, var(--kraft2) 55%, var(--kraft3) 100%);box-shadow:inset .8vh 0 3vh rgba(0,0,0,.35)}
  .bk .mhead{font:800 5vh/.98 var(--sans);letter-spacing:.02em;text-transform:uppercase;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
  .bk .mrule{height:2px;background:rgba(255,255,255,.5);margin:1.6vh 0 .4vh;width:82%}
  .bk .daylabel{font:700 1.7vh/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#3a260f;opacity:.8;margin-bottom:2.6vh}
  .bk .item{padding:2.2vh 0;border-bottom:1px solid rgba(58,38,15,.28)}.bk .item:last-child{border-bottom:0}
  .bk .item .nm{font:600 3vh/1.15 var(--sans);color:#241606}
  .bk .item.sig .kick{font:800 1.4vh/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#5a3a12;background:rgba(255,255,255,.35);display:inline-block;padding:.5vh 1vh;border-radius:2vh;margin-bottom:1vh}
  .bk .item.sig .nm{font:800 4.1vh/1.08 var(--serif);color:#1c1004}
  /* ---- dark slide (cocktail / activity) ---- */
  .dk{position:relative;background:#0e0e0e}
  .dk .media{position:absolute;inset:0;overflow:hidden;background:#000}
  .dk .media img{width:100%;height:100%;object-fit:cover;display:block}
  .dk .media .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16vh;opacity:.4}
  .dk .media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(0,0,0,0) 32%, rgba(8,8,8,.42) 55%, rgba(8,8,8,.9) 82%)}
  .dk .panel{position:relative;z-index:2;margin-left:auto;width:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 5vh;gap:1.6vh;text-shadow:0 2px 16px rgba(0,0,0,.65)}
  .dk .eye{font:800 1.7vh/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  .dk .nm{font:800 7vh/.98 var(--serif);text-transform:uppercase;color:var(--cream);letter-spacing:.01em;text-wrap:balance;max-width:96%}
  .dk .price{font:800 4.4vh/1 var(--serif);color:var(--cream);margin:.4vh 0}
  .dk .ingr{font:600 2.9vh/1.42 var(--serif);color:var(--cream-dim)}
  .dk .desc{font:500 2.7vh/1.38 var(--serif);color:var(--cream-dim);max-width:82%}
  /* full finished-graphic slide (image already has its own text) */
  .slide.full{background:#000}
  .slide.full>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .slide.full .fallcard{position:absolute;inset:0;background:#0e0e0e;display:none}
  .slide.full .fallcard.show{display:flex}
  /* featured-activity slide: photo background + promo text overlay */
  .act{background:#0e0e0e}
  .act .bg{position:absolute;inset:0;overflow:hidden}
  .act .bg img{width:100%;height:100%;object-fit:cover;display:block}
  .act .scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.14) 45%, rgba(0,0,0,.66) 100%)}
  .act .apanel{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh;padding:5vh;text-shadow:0 2px 22px rgba(0,0,0,.8)}
  .act .aeye{font:800 2.5vh/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .act .anm{font:800 8vh/.98 var(--serif);color:var(--cream);text-wrap:balance;max-width:92%}
  .act .aspaces{font:600 4.6vh/1 var(--serif);color:var(--cream);margin-top:.4vh}.act .aspaces b{font-weight:800}
  .act .ainq{font:700 3.1vh/1 var(--sans);letter-spacing:.02em;color:var(--cream-dim);margin-top:1.4vh}
  /* ---- dots + controls ---- */
  .dots{position:fixed;left:50%;bottom:8.5vh;transform:translateX(-50%);display:flex;gap:10px;z-index:15}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(246,237,218,.28);cursor:pointer;transition:.3s}
  .dot.on{background:var(--gold);transform:scale(1.25)}
  .controls{position:fixed;left:50%;bottom:2.4vh;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(14,10,6,.85);border:1px solid rgba(246,237,218,.16);border-radius:12px;padding:8px 10px;z-index:20;backdrop-filter:blur(6px)}
  .controls select,.controls button{font:700 13px var(--sans);border-radius:8px;border:1px solid rgba(246,237,218,.16);background:rgba(255,255,255,.06);color:var(--cream);padding:8px 12px;cursor:pointer}
  .controls button:hover{background:rgba(255,255,255,.14)}
  .controls .nav{width:38px;text-align:center}
  body.fs .controls,body.fs .dots{opacity:0;pointer-events:none;transition:opacity .4s}
  body.fs:hover .controls,body.fs:hover .dots{opacity:1;pointer-events:auto}
  /* ---- setup ---- */
  .setup{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:#17130c;border-left:1px solid rgba(246,237,218,.16);z-index:30;transform:translateX(100%);transition:transform .3s;overflow-y:auto;padding:20px}
  .setup.open{transform:none}
  .setup h2{font:800 15px var(--sans);margin:0 0 4px}.setup .sub{font-size:12px;color:var(--faint);margin-bottom:14px}
  .setup h3{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px;border-top:1px solid rgba(246,237,218,.12);padding-top:14px}
  .setup select{width:100%;font:600 13px var(--sans);color:var(--cream);background:rgba(255,255,255,.05);border:1px solid rgba(246,237,218,.16);border-radius:8px;padding:8px 10px}
  .setup .spaces{display:flex;align-items:center;gap:8px;margin:-2px 0 9px 24px}
  .setup .spaces input{width:74px;font:700 13px var(--sans);color:var(--cream);background:rgba(255,255,255,.06);border:1px solid rgba(246,237,218,.2);border-radius:8px;padding:6px 8px}
  .setup .spaces span{font-size:11.5px;color:var(--faint)}
  .chk{display:flex;align-items:center;gap:9px;font:600 13px var(--sans);cursor:pointer;padding:6px 0}
  .chk input{width:16px;height:16px;accent-color:var(--gold)}
  .chk .mut{color:var(--faint);font-size:11.5px}
  .setup .close{position:absolute;top:14px;right:14px;background:none;border:0;color:var(--cream);font-size:22px;cursor:pointer}
  .setup .row{display:flex;align-items:center;gap:10px}
  .setup input[type=range]{flex:1;accent-color:var(--gold)}
  .link{color:var(--gold);text-decoration:none;font-size:12px}
</style>
<div class="stage" id="stage"></div>
<div class="dots" id="dots"></div>
<div class="controls" id="controls">
  <button class="nav" onclick="ND.prev()">‹</button>
  <button id="playbtn" onclick="ND.play()">⏸</button>
  <button class="nav" onclick="ND.next()">›</button>
  <button onclick="ND.toggleSetup()">⚙ Setup</button>
  <button onclick="ND.fs()">⛶ Full screen</button>
</div>
<div class="setup" id="setup">
  <button class="close" onclick="ND.toggleSetup()">✕</button>
  <h2>Evening display</h2>
  <div class="sub">Rotates tomorrow's breakfast, your signature cocktails, and any featured activities.</div>
  <h3>Tomorrow's breakfast</h3>
  <select id="daysel" onchange="ND.setDay(this.value)"></select>
  <div class="sub" style="margin-top:6px">Signature dish &amp; photo come from <b>Menu Items</b> (the ★ item).</div>
  <h3>Signature cocktails</h3>
  <div id="cocklist"></div>
  <div class="sub">Manage the menu in the <b>Signature Cocktails</b> tool.</div>
  <h3>Featured activities</h3>
  <div id="actlist"></div>
  <h3>Rotation</h3>
  <div class="row"><input type="range" min="4" max="20" id="period" oninput="ND.setPeriod(this.value)"><span id="periodlbl" class="sub" style="margin:0"></span></div>
</div>
<script>
(function(){
  const MENU='talon_menu_v1', PKEY='talon_packages_v1', COCK='talon_cocktails_v1', ACTS='talon_activities_v1', CFG='talon_nightly_v1';
  const el=id=>document.getElementById(id);
  const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const parseD=s=>{const[y,m,d]=(s||'').split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
  const addDays=(s,n)=>{const dt=parseD(s);dt.setDate(dt.getDate()+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');};
  const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtDW=s=>{const d=parseD(s);return DOW[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate();};
  const IMGDB=(()=>{let dbp=null;function open(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{let r;try{r=indexedDB.open('talon-images',1);}catch(e){return rej(e);}r.onupgradeneeded=e=>{try{e.target.result.createObjectStore('photos');}catch(_){}};r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error);});return dbp;}
    return {get:k=>open().then(db=>new Promise(res=>{const rq=db.transaction('photos','readonly').objectStore('photos').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);})).catch(()=>null)};})();
  function resolveIdb(root){[...(root||document).querySelectorAll('img[data-idb]')].forEach(img=>{const k=img.getAttribute('data-idb');img.removeAttribute('data-idb');IMGDB.get(k).then(v=>{if(v){img.src=v;}else{img.style.display='none';const fb=img.parentNode&&img.parentNode.querySelector('.fallback');if(fb)fb.style.display='flex';}});});}

  const loadMenu=()=>{try{return JSON.parse(localStorage.getItem(MENU))||[];}catch(e){return [];}};
  const loadCock=()=>{try{return JSON.parse(localStorage.getItem(COCK))||[];}catch(e){return [];}};
  const loadActs=()=>{try{return JSON.parse(localStorage.getItem(ACTS))||[];}catch(e){return [];}};
  // ---- availability calc for the featured activity's day ----
  const loadTeam=()=>{try{return JSON.parse(localStorage.getItem('talon_team_v1'))||{};}catch(e){return {};}};
  const loadBook=()=>{try{return JSON.parse(localStorage.getItem('talon_bookings_v1'))||[];}catch(e){return [];}};
  const loadSeat=()=>{try{return JSON.parse(localStorage.getItem('talon_boat_seating'))||{};}catch(e){return {};}};
  const loadDaily=()=>{try{return JSON.parse(localStorage.getItem('talon_boat_daily'))||{};}catch(e){return {};}};
  const activeGuides=()=>((loadTeam().guides)||[]).filter(g=>g.active!==false);
  const activeTherapists=()=>((loadTeam().therapists)||[]).filter(t=>t.active!==false);
  const norm=s=>String(s||'').trim().toLowerCase().split(/\s+/)[0];
  function capFor(name){name=(name||'').toLowerCase();
    if(/day spa|spa day/.test(name))return {type:'dayspa'};
    if(/massage/.test(name))return {type:'massage'};
    if(/freshwater/.test(name))return {type:'guided',cap:'Freshwater Fishing (Boat/ATV/Plane)'};
    if(/atv/.test(name))return {type:'guided',cap:'ATV Safari'};
    if(/kayak/.test(name))return {type:'guided',cap:'Kayak & Lunch'};
    if(/whale/.test(name))return {type:'guided',cap:'Whale Watching'};
    if(/hik/.test(name))return {type:'guided',cap:'Hiking'};
    return null;}
  function boatsInUseOn(date){const seat=(loadSeat()[pkgArrival()])||{};const daily=(loadDaily()[date])||{};const used=new Set();const keys=new Set([...Object.keys(seat),...Object.keys(daily)]);keys.forEach(k=>{const b=(k in daily)?daily[k]:seat[k];if(b)used.add(b);});return used;}
  function capsRunningOn(date){const t=loadTeam();const inUse=boatsInUseOn(date);const names=new Set();((t.boats)||[]).filter(b=>b.active!==false&&inUse.has(b.id)).forEach(b=>{const c=((t.captains)||[]).find(x=>x.id===b.captain_id);if(c)names.add(norm(c.name));});return names;}
  function activityDate(){const arrival=pkgArrival();const day=curDay();if(!arrival||!day)return null;return addDays(arrival,dayNum(day));}
  // spaces open for this activity on the featured day (null = can't compute → fall back to manual)
  function activitySpacesCalc(a){const m=capFor(a.name);const date=activityDate();if(!m||!date)return null;const BOOK=loadBook();
    if(m.type==='massage'){return Math.max(0,activeTherapists().length*2-BOOK.filter(b=>b.actId==='massage'&&b.date===date).reduce((s,b)=>s+(b.guests||1),0));}
    if(m.type==='dayspa'){return Math.max(0,2-BOOK.filter(b=>b.actId==='dayspa'&&b.date===date).reduce((s,b)=>s+(b.guests||1),0));}
    const running=capsRunningOn(date);
    const free=activeGuides().filter(g=>(g.activities||[]).includes(m.cap)&&!BOOK.some(b=>b.date===date&&(b.guideIds||[]).includes(g.id))&&!running.has(norm(g.name))).length;
    return free*3;}
  const loadCfg=()=>{let c=null;try{c=JSON.parse(localStorage.getItem(CFG));}catch(e){}if(!c||typeof c!=='object')c={};c.hiddenCocktails=c.hiddenCocktails||[];c.activities=c.activities||[];c.activitySpaces=c.activitySpaces||{};if(!c.period)c.period=9;return c;};
  const saveCfg=c=>{try{localStorage.setItem(CFG,JSON.stringify(c));}catch(e){}};
  function pkgArrival(){try{const p=(JSON.parse(localStorage.getItem(PKEY))||[]).filter(x=>x.arrival_start_date&&(!x.status||x.status==='published')).sort((a,b)=>a.arrival_start_date<b.arrival_start_date?-1:1)[0];return p?p.arrival_start_date:null;}catch(e){return null;}}
  function menuDays(){const days=[...new Set(loadMenu().filter(m=>m.type==='Breakfast').map(m=>m.day))];return days.sort((a,b)=>(+(/([0-9]+)/.exec(a)||[])[1]||99)-(+(/([0-9]+)/.exec(b)||[])[1]||99));}
  const dayNum=d=>{const m=/([0-9]+)/.exec(d||'');return m?+m[1]:0;};
  function dayItems(day){const reg=loadMenu().filter(m=>m.type==='Breakfast'&&m.day===day&&m.kind==='Regular');const sig=reg.find(m=>m.signature)||reg[0]||null;return {sig,rest:reg.filter(m=>m!==sig)};}
  const activeCocktails=()=>{const cfg=loadCfg();return loadCock().filter(c=>c.active!==false&&!cfg.hiddenCocktails.includes(c.id)).sort((a,b)=>(a.sort||0)-(b.sort||0));};
  const featuredActs=()=>{const cfg=loadCfg();const A=loadActs();return cfg.activities.map(id=>A.find(a=>a.id===id)).filter(Boolean);};

  const imgTag=(photo,cls)=>{if(!photo)return `<div class="fallback">🍸</div>`;const a=photo.indexOf('idb:')===0?`data-idb="${esc(photo.slice(4))}"`:`src="${esc(photo)}"`;return `<img ${a} class="${cls||''}" alt="" onerror="this.style.display='none';var f=this.parentNode.querySelector('.fallback');if(f)f.style.display='flex'"><div class="fallback" style="display:none">🍸</div>`;};

  function breakfastSlide(day){const {sig,rest}=dayItems(day);const photo=(sig&&sig.photo)||'';const arrival=pkgArrival();const dateStr=arrival?fmtDW(addDays(arrival,dayNum(day))):'';
    const heroInner=photo
      ? `<img ${photo.indexOf('idb:')===0?`data-idb="${esc(photo.slice(4))}"`:`src="${esc(photo)}"`} alt="" onerror="this.style.display='none';this.parentNode.querySelector('.fallback').style.display='flex'"><div class="fallback" style="display:none"><div class="plate">🍳</div><div class="fn">${esc(sig?sig.name:'')}</div></div>`
      : `<div class="fallback"><div class="plate">🍳</div><div class="fn">${esc(sig?sig.name:'Add a photo in Menu Items')}</div></div>`;
    const items=(sig?`<div class="item sig"><div class="kick">Signature · ${esc(day)}</div><div class="nm">${esc(sig.name)}</div></div>`:'')+rest.map(m=>`<div class="item"><div class="nm">${esc(m.name)}</div></div>`).join('');
    return `<div class="slide bk"><div class="hero">${heroInner}<div class="brandmark"><div class="bt">Talon Lodge &amp; Spa</div><div class="bs">Tomorrow's Breakfast</div></div></div>
      <div class="menu"><div class="mhead">Breakfast Menu</div><div class="mrule"></div>${dateStr?`<div class="daylabel">${esc(day)} · ${esc(dateStr)}</div>`:`<div class="daylabel">${esc(day)}</div>`}<div class="items">${items||'<div class="item"><div class="nm">No breakfast items.</div></div>'}</div></div></div>`;
  }
  const onerr="this.style.display='none';var f=this.parentNode.querySelector('.fallcard');if(f)f.classList.add('show')";
  function cocktailCard(c){return `<div class="media"><div class="fallback">🍸</div></div><div class="panel"><div class="eye">Signature Cocktail</div><div class="nm">${esc(c.name)}</div><div class="price">$${esc(c.price)}</div><div class="ingr">${(c.ingredients||[]).map(i=>`<div>${esc(i)}</div>`).join('')}</div></div>`;}
  function cocktailSlide(c){
    if(c.photo){const a=c.photo.indexOf('idb:')===0?`data-idb="${esc(c.photo.slice(4))}"`:`src="${esc(c.photo)}"`;
      return `<div class="slide full"><img ${a} alt="" onerror="${onerr}"><div class="fallcard dk">${cocktailCard(c)}</div></div>`;}
    return `<div class="slide dk">${cocktailCard(c)}</div>`;}
  function activitySlide(a){const photo=(a.photos&&a.photos[0])||'';const cfg=loadCfg();const calc=activitySpacesCalc(a);const man=cfg.activitySpaces[a.id];
    const spaces=(calc!=null)?calc:((man===''||man==null)?'—':man);
    const overlay=`<div class="apanel"><div class="aeye">AVAILABLE TOMORROW</div><div class="anm">${esc(a.name)}</div><div class="aspaces"><b>${esc(spaces)}</b> spaces</div><div class="ainq">Inquire at the bar</div></div>`;
    if(photo){const imgAttr=photo.indexOf('idb:')===0?`data-idb="${esc(photo.slice(4))}"`:`src="${esc(photo)}"`;return `<div class="slide act"><div class="bg"><img ${imgAttr} alt="" onerror="this.style.display='none'"></div><div class="scrim"></div>${overlay}</div>`;}
    return `<div class="slide act"><div class="scrim"></div>${overlay}</div>`;}

  let idx=0,timer=null,playing=true;
  function slidesHTML(){const day=curDay();const out=[];if(day)out.push(breakfastSlide(day));activeCocktails().forEach(c=>out.push(cocktailSlide(c)));featuredActs().forEach(a=>out.push(activitySlide(a)));return out;}
  function curDay(){const ds=menuDays();const cfg=loadCfg();if(cfg.day&&ds.includes(cfg.day))return cfg.day;return ds[0]||'';}

  function render(){
    const slides=slidesHTML();
    if(!slides.length){el('stage').innerHTML='';el('dots').innerHTML='';el('stage').insertAdjacentHTML('beforeend','<div class="emptymsg">Nothing to show yet — add a breakfast menu, cocktails, or feature an activity in Setup.</div>');renderSetup();return;}
    el('stage').innerHTML=slides.map((h,i)=>h.replace('class="slide',i===0?'class="slide on':'class="slide')).join('');
    el('dots').innerHTML=slides.map((_,i)=>`<span class="dot ${i===0?'on':''}" onclick="ND.go(${i})"></span>`).join('');
    idx=0;resolveIdb(el('stage'));restart();renderSetup();
  }
  function show(i){const s=[...el('stage').querySelectorAll('.slide')];if(!s.length)return;idx=(i+s.length)%s.length;s.forEach((x,j)=>x.classList.toggle('on',j===idx));[...el('dots').children].forEach((d,j)=>d.classList.toggle('on',j===idx));}
  function restart(){clearInterval(timer);const p=(loadCfg().period||9)*1000;if(playing&&el('stage').querySelectorAll('.slide').length>1)timer=setInterval(()=>show(idx+1),p);}

  function renderSetup(){
    const ds=menuDays();el('daysel').innerHTML=ds.map(d=>`<option ${d===curDay()?'selected':''}>${esc(d)}</option>`).join('');
    const cfg=loadCfg();
    el('cocklist').innerHTML=loadCock().filter(c=>c.active!==false).map(c=>`<label class="chk"><input type="checkbox" ${!cfg.hiddenCocktails.includes(c.id)?'checked':''} onchange="ND.toggleCock(${c.id},this.checked)"> ${esc(c.name)} <span class="mut">$${esc(c.price)}</span></label>`).join('')||'<div class="sub">No cocktails yet — add them in Signature Cocktails.</div>';
    const A=loadActs().filter(a=>!a.status||a.status==='active');
    el('actlist').innerHTML=A.map(a=>{const on=cfg.activities.includes(a.id);const sp=cfg.activitySpaces[a.id];const calc=activitySpacesCalc(a);
      return `<label class="chk"><input type="checkbox" ${on?'checked':''} onchange="ND.toggleAct(${a.id},this.checked)"> ${esc(a.icon||'')} ${esc(a.name)}</label>`+(on?`<div class="spaces"><input type="number" min="0" value="${sp==null?'':esc(sp)}" onchange="ND.setSpaces(${a.id},this.value)" placeholder="auto"><span>${calc!=null?('auto: <b>'+calc+'</b> from availability'+((sp!==''&&sp!=null)?' · override set':' · leave blank to use it')):'spaces (manual — no availability rule)'}</span></div>`:'');
    }).join('')||'<div class="sub">No activities found — add them in Activities.</div>';
    el('period').value=cfg.period||9;el('periodlbl').textContent=(cfg.period||9)+'s per slide';
  }

  window.ND={
    next(){show(idx+1);restart();},prev(){show(idx-1);restart();},go(i){show(i);restart();},
    play(){playing=!playing;el('playbtn').textContent=playing?'⏸':'▶';restart();},
    setDay(d){const c=loadCfg();c.day=d;saveCfg(c);render();},
    toggleCock(id,on){const c=loadCfg();c.hiddenCocktails=c.hiddenCocktails.filter(x=>x!==id);if(!on)c.hiddenCocktails.push(id);saveCfg(c);render();},
    toggleAct(id,on){const c=loadCfg();c.activities=c.activities.filter(x=>x!==id);if(on)c.activities.push(id);saveCfg(c);render();},
    setSpaces(id,v){const c=loadCfg();if(v===''||v==null)delete c.activitySpaces[id];else c.activitySpaces[id]=v;saveCfg(c);render();},
    setPeriod(v){const c=loadCfg();c.period=+v||9;saveCfg(c);el('periodlbl').textContent=c.period+'s per slide';restart();},
    toggleSetup(){el('setup').classList.toggle('open');},
    fs(){const d=document.documentElement;if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen).call(d);document.body.classList.add('fs');}else{document.exitFullscreen();document.body.classList.remove('fs');}}
  };
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fs');});
  let sig='';function dataSig(){return JSON.stringify(loadMenu().map(m=>[m.day,m.name,m.signature,m.photo]))+JSON.stringify(loadCock())+JSON.stringify(loadCfg())+JSON.stringify(loadActs().map(a=>[a.id,a.name,(a.photos||[]).length,a.status]))+JSON.stringify(loadBook().map(b=>[b.actId,b.date,b.guests,(b.guideIds||[]).length]))+JSON.stringify((loadTeam().guides||[]).length);}
  window.addEventListener('storage',()=>{if(dataSig()!==sig){sig=dataSig();render();}});
  window.addEventListener('focus',()=>{if(dataSig()!==sig){sig=dataSig();render();}});
  sig=dataSig();render();
})();
</script>
</body></html>
